<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドット歩行テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@400;700&display=swap">
<style>
:root {
  --bg: #e9ecef; --panel: #f7f8fa; --ink: #1f2429; --muted: #5d6670;
  --line: #c9cfd6; --accent: #3b82a6; --key: #ffffff; --warn: #b4532a;
  --display: "DotGothic16", "M PLUS 1p", system-ui, sans-serif;
  --body: "M PLUS 1p", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15191d; --panel: #1d2329; --ink: #e6eaee; --muted: #9aa4ae;
    --line: #333c45; --accent: #6fb6d6; --key: #262e35; --warn: #e08a62; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 14px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0; letter-spacing: .02em; }
h2 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin: 0 0 12px; }
.sub { margin: 0; color: var(--muted); font-size: .9rem; }
.box { border: 3px solid var(--ink); background: var(--panel); padding: 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.card {
  display: grid; justify-items: center; gap: 8px; cursor: pointer;
  background: var(--key); border: 2px solid var(--line); padding: 14px 22px 12px;
  font: 700 .9rem var(--body); color: var(--ink); padding: 10px 6px 8px;
}
.card:hover, .card.last { border-color: var(--accent); }
.card canvas { width: 60px; height: 96px; image-rendering: pixelated; background: #46663f; }
.lobby { display: grid; gap: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font: 700 .95rem var(--body); color: var(--ink); background: var(--key);
  border: 2px solid var(--line); padding: 9px 16px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--key); }
.btn:disabled { opacity: .5; cursor: default; }
input[type=text] {
  font: 1.2rem var(--display); letter-spacing: .25em;
  width: 8.5em; padding: 7px 10px; border: 2px solid var(--line); background: var(--key); color: var(--ink);
}
.msg { min-height: 1.6em; margin: 0; font-size: .9rem; color: var(--muted); }
.msg.err { color: var(--warn); }
.link { font: .9rem var(--body); color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
.label { font-size: .75rem; letter-spacing: .08em; color: var(--muted); }
/* full-screen play view: canvas fills the window, HUD floats on top */
.play { position: fixed; inset: 0; z-index: 10; background: #1d4f6e; overflow: hidden; }
canvas#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }
.hud-top, .hud-bottom {
  position: absolute; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hud-top { top: 0; padding-top: calc(8px + env(safe-area-inset-top, 0px)); justify-content: space-between; }
.hud-bottom { bottom: 0; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); justify-content: flex-end; align-items: flex-end; }
.chip {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 6px;
  background: rgba(16, 22, 28, .72); color: #f1f4f6; border: 1px solid rgba(255,255,255,.18);
  padding: 5px 10px; font: 700 .85rem var(--body); line-height: 1.4;
}
button.chip { cursor: pointer; }
.chip button { font: inherit; color: #9fd3ee; background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
.chip input { margin: 0; }
.code { font-family: var(--display); font-size: 1.15rem; letter-spacing: .15em; font-weight: 400; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; font-weight: 400; font-size: .8rem; }
.plist li { display: flex; gap: 6px; align-items: center; }
.dot { width: 9px; height: 9px; display: inline-block; flex: none; }
.toast {
  position: absolute; left: 50%; top: calc(56px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  max-width: calc(100% - 32px); margin: 0; text-align: center; pointer-events: none;
  background: rgba(16, 22, 28, .78); color: #f1f4f6; padding: 6px 12px; font-size: .85rem; transition: opacity .6s;
}
.toast:empty { display: none; }
.atk {
  position: absolute; z-index: 2; width: 84px; height: 84px; border-radius: 50%;
  right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(58px + env(safe-area-inset-bottom, 0px));
  background: rgba(214, 72, 64, .82); color: #fff; border: 3px solid rgba(255,255,255,.75);
  font: 1.05rem var(--display); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
}
.atk.on { background: rgba(255, 120, 100, .95); transform: scale(.94); }
.atk:disabled { background: rgba(90, 90, 90, .7); }
.life { color: #ff6b6b; letter-spacing: .05em; }
.life.down { color: #c0c6cc; }
.toast.fade { opacity: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>ドット歩行テスト</h1>
    <p class="sub">キャラを選んで部屋を作るか、部屋コードで入ると、最大4人で同じ画面を歩けます。</p>
  </div>

  <!-- 1. character select -->
  <section id="select" class="box">
    <h2>使うキャラを選んでください</h2>
    <div class="cards">
      <!-- cards are built from CHARS in the script -->
    </div>
  </section>

  <!-- 2. lobby -->
  <section id="lobby" class="box" hidden>
    <div class="lobby">
      <div>
        <h2>部屋を作る</h2>
        <div class="row">
          <button class="btn primary" id="create">新しい部屋を作る</button>
          <span class="sub">作った人が部屋の親になります。親が抜けると部屋は終了します。</span>
        </div>
      </div>
      <div>
        <h2>部屋に入る</h2>
        <div class="row">
          <label for="code-in" class="label">部屋コード</label>
          <input type="text" id="code-in" maxlength="4" autocomplete="off" inputmode="numeric" pattern="[0-9]*" placeholder="1234">
          <button class="btn" id="join">入る</button>
        </div>
      </div>
      <p class="msg" id="lobby-msg" role="status"></p>
      <button class="link" id="back">キャラを選び直す</button>
      <a class="link" href="items.html">アイテム素材一覧</a>
    </div>
  </section>

</div>

<!-- 3. play (full screen) -->
<section id="play" class="play" hidden>
  <canvas id="game" aria-label="ゲーム画面。タップでその場所へ移動、押したままずらすとその方向へ移動"></canvas>
  <div class="hud-top">
    <div class="chip">部屋 <span class="code" id="room-code"></span> <button id="copy">招待リンクをコピー</button> <span id="copy-msg" role="status"></span></div>
    <div class="chip"><ul class="plist" id="plist" aria-label="参加者"></ul><span id="count" hidden></span></div>
  </div>
  <p class="toast" id="play-msg" role="status"></p>
  <button class="atk" id="atk" aria-label="攻撃（スペースキー）">攻撃</button>
  <div class="hud-bottom">
    <label class="chip"><input type="checkbox" id="run"> 走る</label>
    <button class="chip" id="fs">全画面</button>
    <button class="chip" id="leave">退出</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
// ---------- constants ----------
// To add a character: put <id>_walk.png (20x32 frames, 4x4) in assets/sprites and add a line here.
const CHARS = [
  ['shibata', '柴田さん'], ['cyber', 'サイバー'], ['yami', 'ヤミさん'], ['kitamura', '北村さん'],
  ['yamada', '山田さん'], ['shindo', '新藤さん'], ['takeda', '武田さん'], ['kikuchi', '菊地さん'], ['mabuchi', '馬淵さん'],
];
const SHEETS = CHARS.map(c => 'assets/sprites/' + c[0] + '_walk.png');
const NAMES = CHARS.map(c => c[1]);
(() => {
  const box = document.querySelector('#select .cards');
  CHARS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'card'; b.id = 'pick-' + i; b.dataset.i = String(i);
    const cv = document.createElement('canvas'); cv.width = 20; cv.height = 32;
    const sp = document.createElement('span'); sp.textContent = c[1];
    b.append(cv, sp); box.append(b);
  });
})();
const SLOT_COLORS = ['#e8c547', '#e0644f', '#5aa9e6', '#9b6be0'];   // P1..P4 tags
const FW = 20, FH = 32, ROWS = { down: 0, left: 1, right: 2, up: 3 };
const TILE = 16, MAX = 4;
const MAP_W = 72, MAP_H = 54;                 // island map in tiles (the edge is sea)
const WORLD_W = MAP_W * TILE, WORLD_H = MAP_H * TILE;
const ID_PREFIX = 'dotwalk-shibata-test001-';
const CODE_CHARS = '0123456789';
const SEND_MS = 66, TIMEOUT_MS = 6000;
// battle
const LIFE_MAX = 3, SHOT_SPEED = 170, SHOT_RANGE = 150, SHOT_CD = 450, INV_MS = 1000, DOWN_MS = 3000;

const $ = id => document.getElementById(id);
const imgs = SHEETS.map(src => { const im = new Image(); im.src = src; return im; });

// ---------- state ----------
const me = { c: 0, x: WORLD_W / 2, y: WORLD_H / 2, dir: 'down', m: false, t: 0, held: new Set(), slot: 0,
  life: LIFE_MAX, down: false, inv: false, ko: 0, aimX: 0, aimY: 1, lastShot: -1e9, atkT: -1e9 };
const shots = new Map();           // id -> {id, slot, x, y, vx, vy, dist}   (x,y = point on the ground)
let sparks = [];                   // hit effects
let shotSeq = 0, atkHeld = false;
const stats = new Map();           // host only: slot -> {life, invUntil, down, downUntil, ko}
const freshStat = () => ({ life: LIFE_MAX, invUntil: performance.now() + 1500, down: false, downUntil: 0, ko: 0 });
let screen = 'select';
let peer = null, isHost = false, roomCode = '';
let hostConn = null;               // client side: connection to host
const conns = new Map();           // host side: peerId -> {conn, slot, last}
let others = new Map();            // key -> {slot,c,x,y,dir,m, dx,dy,t}
let lastHostMsg = 0;

function show(name) {
  screen = name;
  $('select').hidden = name !== 'select';
  $('lobby').hidden = name !== 'lobby';
  $('play').hidden = name !== 'play';
}
function lobbyMsg(text, err) { const el = $('lobby-msg'); el.textContent = text; el.classList.toggle('err', !!err); }

// ---------- 1. select ----------
const cardCtx = CHARS.map((_, i) => { const c = document.querySelector('#pick-' + i + ' canvas').getContext('2d'); c.imageSmoothingEnabled = false; return c; });
try { const s = localStorage.getItem('chara'); if (s !== null) $('pick-' + s)?.classList.add('last'); } catch (e) {}
document.querySelectorAll('.card').forEach(b => b.addEventListener('click', () => {
  me.c = Math.min(CHARS.length - 1, Math.max(0, +b.dataset.i | 0));
  try { localStorage.setItem('chara', String(me.c)); } catch (e) {}
  show('lobby'); lobbyMsg('');
  const q = new URLSearchParams(location.search).get('room');
  if (q) { $('code-in').value = q.replace(/\D/g, '').slice(0, 4); $('join').focus(); }
}));
$('back').addEventListener('click', () => show('select'));

// ---------- 2. lobby / networking ----------
function randomCode() { let s = ''; for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.random() * CODE_CHARS.length | 0]; return s; }
function busy(b) { $('create').disabled = b; $('join').disabled = b; }

function errorText(type) {
  return ({
    'peer-unavailable': 'その部屋コードの部屋が見つかりません。コードを確認するか、部屋が開いているか親に確認してください。',
    'network': '通信サーバーにつながりません。ネットワークを確認してもう一度試してください。',
    'server-error': '通信サーバーでエラーが起きました。少し待ってからもう一度試してください。',
    'browser-incompatible': 'このブラウザは対応していません。Chrome・Safari・Edgeの最新版で開いてください。',
  })[type] || '接続できませんでした（' + type + '）。もう一度試してください。';
}

$('create').addEventListener('click', () => createRoom(0));
function createRoom(tries) {
  busy(true); lobbyMsg('部屋を作っています…');
  const code = randomCode();
  const p = new Peer(ID_PREFIX + code);
  p.on('open', () => {
    peer = p; isHost = true; roomCode = code; me.slot = 1; me.x = spawnX(1); me.y = WORLD_H / 2;
    stats.clear(); stats.set(1, freshStat());
    p.on('connection', onHostConnection);
    enterPlay();
  });
  p.on('error', err => {
    if (err.type === 'unavailable-id' && tries < 8) { p.destroy(); createRoom(tries + 1); return; }
    if (peer === p) { console.warn('peer error (room kept)', err.type); return; }   // already hosting: keep the room, 'disconnected' reconnects
    p.destroy(); busy(false); lobbyMsg(errorText(err.type), true);
  });
  p.on('disconnected', () => { if (peer === p) p.reconnect(); });
}

$('join').addEventListener('click', joinRoom);
$('code-in').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
function joinRoom() {
  const code = $('code-in').value.replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/\D/g, '');
  if (!/^\d{4}$/.test(code)) { lobbyMsg('部屋コードは4桁の数字です。', true); return; }
  busy(true); lobbyMsg('部屋に入っています…');
  const p = new Peer();
  let giveUp = 0;
  p.on('open', () => {
    const conn = p.connect(ID_PREFIX + code, { reliable: true, metadata: { c: me.c } });
    giveUp = setTimeout(() => { if (!hostConn) { p.destroy(); busy(false); lobbyMsg('部屋に入れませんでした。コードを確認してもう一度試してください。', true); } }, 10000);
    conn.on('data', d => {
      if (d.t === 'full') { clearTimeout(giveUp); p.destroy(); busy(false); lobbyMsg('この部屋は満員です（最大4人）。', true); return; }
      if (d.t === 'welcome') {
        clearTimeout(giveUp);
        peer = p; isHost = false; roomCode = code; hostConn = conn; me.slot = d.slot;
        me.x = d.x; me.y = d.y; lastHostMsg = performance.now();
        enterPlay();
        return;
      }
      if (d.t === 'all') { lastHostMsg = performance.now(); applyAll(d.ps); }
      else if (d.t === 'shot') addShot(d);
      else if (d.t === 'hit') onHit(d);
      else if (d.t === 'respawn') onRespawn(d);
    });
    conn.on('close', () => { if (hostConn === conn) endRoom('親が部屋を閉じたため、部屋が終了しました。'); });
  });
  p.on('error', err => {
    if (peer === p) { console.warn('peer error (still in room)', err.type); return; }  // in room: the host timeout decides
    clearTimeout(giveUp); p.destroy(); busy(false); lobbyMsg(errorText(err.type), true);
  });
}

// host side
function spawnX(slot) { return WORLD_W / 2 + (slot - 2.5) * 28; }
function freeSlot() { const used = new Set([1, ...[...conns.values()].map(v => v.slot)]); for (let s = 1; s <= MAX; s++) if (!used.has(s)) return s; return 0; }
function onHostConnection(conn) {
  conn.on('open', () => {
    const slot = freeSlot();
    if (!slot) { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 500); return; }
    const st = { slot, c: Math.min(CHARS.length - 1, Math.max(0, (conn.metadata && conn.metadata.c) | 0)), x: spawnX(slot), y: WORLD_H / 2, dir: 'down', m: false };
    conns.set(conn.peer, { conn, slot, last: performance.now() });
    stats.set(slot, freshStat());
    others.set(conn.peer, { ...st, dx: st.x, dy: st.y, t: 0 });
    conn.send({ t: 'welcome', slot, x: st.x, y: st.y });
    renderList();
  });
  conn.on('data', d => {
    const rec = conns.get(conn.peer); if (!rec) return;
    if (d.t === 'shot') {                       // relay a client's shot to everyone else
      const st = stats.get(rec.slot);
      if (!st || st.down || d.slot !== rec.slot) return;
      const sh = addShot(d); if (sh) broadcast({ t: 'shot', ...sh }, conn.peer);
      return;
    }
    if (d.t !== 's') return;
    rec.last = performance.now();
    const o = others.get(conn.peer);
    if (o) Object.assign(o, { c: d.c | 0, x: +d.x, y: +d.y, dir: ROWS[d.dir] !== undefined ? d.dir : 'down', m: !!d.m });
  });
  const drop = () => { const rec = conns.get(conn.peer); if (conns.delete(conn.peer)) { others.delete(conn.peer); if (rec) stats.delete(rec.slot); renderList(); } };
  conn.on('close', drop);
  conn.on('error', drop);
}

// client side: replace the roster with the host's snapshot
function applyAll(ps) {
  const next = new Map();
  for (const p of ps) {
    if (p.slot === me.slot) {
      if (p.life !== undefined) { me.life = p.life; me.down = !!p.down; me.inv = !!p.inv; me.ko = p.ko | 0; }
      continue;
    }
    const key = 's' + p.slot, prev = others.get(key);
    next.set(key, { ...p, dx: prev ? prev.dx : p.x, dy: prev ? prev.dy : p.y, t: prev ? prev.t : 0, atkT: prev ? prev.atkT : -1e9 });
  }
  const changed = next.size !== others.size || [...next.keys()].some(k => !others.has(k));
  others = next;
  if (changed) renderList(); else refreshListIfChanged();
}

function myState() { return { slot: me.slot, c: me.c, x: Math.round(me.x * 10) / 10, y: Math.round(me.y * 10) / 10, dir: me.dir, m: me.m, ...(isHost ? statOut(me.slot) : {}) }; }
function statOut(slot) { const st = stats.get(slot), now = performance.now(); return st ? { life: st.life, down: st.down, inv: now < st.invUntil, ko: st.ko } : {}; }
function broadcast(msg, exceptPeer) { for (const [id, { conn }] of conns) if (id !== exceptPeer && conn.open) conn.send(msg); }
function otherBySlot(slot) { for (const o of others.values()) if (o.slot === slot) return o; return null; }
let listSig = '';
function syncFromStats() {    // host: copy authoritative battle state onto the drawn players
  Object.assign(me, statOut(me.slot));
  for (const o of others.values()) Object.assign(o, statOut(o.slot));
  refreshListIfChanged();
}
function refreshListIfChanged() {
  const sig = [me, ...others.values()].map(p => p.slot + ':' + p.life + ':' + p.down + ':' + p.ko).join('|');
  if (sig !== listSig) { listSig = sig; renderList(); }
}

// ---------- battle ----------
function addShot(d) {
  const id = String(d.id), slot = d.slot | 0;
  if (shots.has(id) || !(slot >= 1 && slot <= MAX)) return null;
  const v = Math.hypot(+d.vx, +d.vy) || 1;
  const sh = { id, slot, x: +d.x, y: +d.y, vx: d.vx / v * SHOT_SPEED, vy: d.vy / v * SHOT_SPEED, dist: 0 };
  if (!isFinite(sh.x) || !isFinite(sh.y)) return null;
  shots.set(id, sh);
  if (slot !== me.slot) { const o = otherBySlot(slot); if (o) o.atkT = performance.now(); }
  return sh;
}
function fire() {
  const now = performance.now();
  if (screen !== 'play' || !peer || me.down || now - me.lastShot < SHOT_CD) return;
  me.lastShot = now; me.atkT = now;
  const sh = addShot({ id: me.slot + '-' + (++shotSeq) + '-' + (now | 0), slot: me.slot, x: me.x + me.aimX * 8, y: me.y + me.aimY * 6, vx: me.aimX, vy: me.aimY });
  if (!sh) return;
  if (isHost) broadcast({ t: 'shot', ...sh });
  else if (hostConn && hostConn.open) hostConn.send({ t: 'shot', ...sh });
}
function stepShots(dt, now) {
  for (const sh of shots.values()) {
    sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.dist += SHOT_SPEED * dt;
    if (sh.dist > SHOT_RANGE) { shots.delete(sh.id); continue; }
    if (!isHost) continue;                      // only the host decides hits
    const targets = [{ slot: me.slot, x: me.x, y: me.y }, ...[...others.values()].map(o => ({ slot: o.slot, x: o.x, y: o.y }))];
    for (const t of targets) {
      if (t.slot === sh.slot) continue;
      const st = stats.get(t.slot);
      if (!st || st.down || now < st.invUntil) continue;
      if (Math.abs(sh.x - t.x) < 9 && Math.abs(sh.y - t.y) < 7) {
        st.life = Math.max(0, st.life - 1); st.invUntil = now + INV_MS;
        if (st.life === 0) { st.down = true; st.downUntil = now + DOWN_MS; const by = stats.get(sh.slot); if (by) by.ko++; }
        const v = Math.hypot(sh.vx, sh.vy) || 1;
        const msg = { t: 'hit', id: sh.id, victim: t.slot, by: sh.slot, life: st.life, kx: sh.vx / v, ky: sh.vy / v };
        broadcast(msg); onHit(msg); syncFromStats();
        break;
      }
    }
  }
}
function slotName(slot) {
  if (slot === me.slot) return 'あなた';
  const o = otherBySlot(slot); return 'P' + slot + (o ? '（' + (NAMES[o.c] || '？') + '）' : '');
}
function onHit(d) {
  const sh = shots.get(String(d.id)); shots.delete(String(d.id));
  const victim = d.victim === me.slot ? me : otherBySlot(d.victim);

        p: { life: me.life, down: me.down, inv: me.inv, atkT: me.atkT, ax: me.aimX, ay: me.aimY } },
      ...[...others.values()].map(o => ({ c: o.c, x: o.dx, y: o.dy, dir: o.dir, f: o.m ? Math.floor(o.t) % 4 : 0, slot: o.slot, me: false,
        p: { life: o.life, down: o.down, inv: o.inv, atkT: o.atkT, ax: (VD[o.dir] || [0, 1])[0], ay: (VD[o.dir] || [0, 1])[1] } })),
    ].sort((a, b) => a.y - b.y);
    // shots: shadow on the ground, orb at chest height
    for (const sh of shots.values()) {
      const sx = Math.round(sh.x), sy = Math.round(sh.y);
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(sx - 2, sy - 1, 5, 2);
      const v = Math.hypot(sh.vx, sh.vy) || 1, ux = sh.vx / v, uy = sh.vy / v;
      ctx.fillStyle = SLOT_COLORS[sh.slot - 1] || '#fff';
      ctx.globalAlpha = .45; ctx.fillRect(Math.round(sx - ux * 5) - 1, Math.round(sy - 12 - uy * 5) - 1, 3, 3);
      ctx.globalAlpha = 1;
      ctx.fillRect(sx - 2, sy - 14, 5, 5);
      ctx.fillStyle = '#fff'; ctx.fillRect(sx - 1, sy - 13, 3, 3);
    }
    for (const p of list) drawChar(p.c, p.x, p.y, p.dir, p.f, p.slot, p.me, p.p);
    sparks = sparks.filter(sp => now - sp.t < 300);
    for (const sp of sparks) {
      const k = (now - sp.t) / 300, r = 3 + k * 7;
      ctx.fillStyle = 'rgba(255, 245, 200,' + (1 - k).toFixed(2) + ')';
      for (let a = 0; a < 8; a++) ctx.fillRect(Math.round(sp.x + Math.cos(a * Math.PI / 4) * r) - 1, Math.round(sp.y + Math.sin(a * Math.PI / 4) * r) - 1, 2, 2);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);                               // screen space
    if (stick) {    // virtual stick
      ctx.save();
      ctx.globalAlpha = .55; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_R, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = .8; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(stick.kx, stick.ky, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if (typeof Peer === 'undefined') {
  $('create').disabled = $('join').disabled = true;
  lobbyMsg('通信用の部品を読み込めませんでした。ページを再読み込みしてください。', true);
}
</script>
