<title>ドット歩行テスト</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@400;700&display=swap">
<style>
/* Layout: one game screen on top, controls under it; stacks naturally on phones */
:root {
  --bg: #e9ecef;
  --panel: #f7f8fa;
  --ink: #1f2429;
  --muted: #5d6670;
  --line: #c9cfd6;
  --accent: #3b82a6;
  --key: #ffffff;
  --display: "DotGothic16", "M PLUS 1p", system-ui, sans-serif;
  --body: "M PLUS 1p", "Hiragino Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191d; --panel: #1d2329; --ink: #e6eaee; --muted: #9aa4ae;
    --line: #333c45; --accent: #6fb6d6; --key: #262e35; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191d; --panel: #1d2329; --ink: #e6eaee; --muted: #9aa4ae;
  --line: #333c45; --accent: #6fb6d6; --key: #262e35; color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: .9rem; }
.stage {
  position: relative; width: 100%; max-width: 100%;
  border: 3px solid var(--ink); background: #3d5a3a;
  image-rendering: pixelated;
}
canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; touch-action: none; }
.controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: space-between; }
.who { display: grid; gap: 8px; min-width: 0; }
.label { font-size: .75rem; letter-spacing: .08em; color: var(--muted); }
.pick { display: flex; gap: 8px; flex-wrap: wrap; }
.pick button {
  font: 700 .95rem var(--body); color: var(--ink); background: var(--key);
  border: 2px solid var(--line); padding: 8px 14px; cursor: pointer;
}
.pick button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.keys { font-size: .9rem; color: var(--muted); line-height: 1.7; }
kbd {
  font-family: var(--display); font-size: .85rem; color: var(--ink);
  background: var(--key); border: 1px solid var(--line); border-bottom-width: 3px;
  padding: 0 6px;
}
.pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; user-select: none; -webkit-user-select: none; }
.pad button {
  font: 1.2rem var(--display); color: var(--ink); background: var(--key);
  border: 2px solid var(--line); cursor: pointer; touch-action: none;
}
.pad button.on { background: var(--accent); color: var(--key); border-color: var(--accent); }
.pad .u { grid-column: 2; grid-row: 1; } .pad .l { grid-column: 1; grid-row: 2; }
.pad .r { grid-column: 3; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 3; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h2 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin: 0 0 12px; }
.select { border: 3px solid var(--ink); background: var(--panel); padding: 20px; }
.cards { display: flex; flex-wrap: wrap; gap: 14px; }
.card {
  display: grid; justify-items: center; gap: 8px; cursor: pointer;
  background: var(--key); border: 2px solid var(--line); padding: 14px 22px 12px;
  font: 700 1rem var(--body); color: var(--ink);
}
.card:hover, .card.last { border-color: var(--accent); }
.card canvas { width: 80px; height: 128px; image-rendering: pixelated; background: #46663f; }
.now { font-family: var(--display); font-weight: 400; font-size: 1.3rem; }
.change {
  justify-self: start; font: .9rem var(--body); color: var(--accent); background: none;
  border: 0; padding: 0; text-decoration: underline; cursor: pointer;
}
.speed { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
</style>

<div class="wrap">
  <div>
    <h1>ドット歩行テスト</h1>
    <p class="sub">キャラを選ぶと、そのキャラで歩き回れます。</p>
  </div>

  <section id="select" class="select" aria-labelledby="select-h">
    <h2 id="select-h">使うキャラを選んでください</h2>
    <div class="cards">
      <button class="card" id="pick-0" data-i="0"><canvas width="20" height="32"></canvas><span>柴田さん</span></button>
      <button class="card" id="pick-1" data-i="1"><canvas width="20" height="32"></canvas><span>chara2</span></button>
    </div>
  </section>

  <section id="play" hidden>
    <div class="stage"><canvas id="game" width="320" height="192"></canvas></div>
    <div class="controls">
      <div class="who">
        <span class="label">操作中のキャラ</span>
        <strong id="now" class="now"></strong>
        <div class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> または <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> で移動</div>
        <label class="speed"><input type="checkbox" id="run"> 走る（2倍速）</label>
        <button id="change" class="change">キャラを選び直す</button>
      </div>
      <div class="pad" aria-label="十字ボタン">
        <button class="u" data-dir="up" aria-label="上">▲</button>
        <button class="l" data-dir="left" aria-label="左">◀</button>
        <button class="r" data-dir="right" aria-label="右">▶</button>
        <button class="d" data-dir="down" aria-label="下">▼</button>
      </div>
    </div>
  </section>
</div>

];
const FW = 20, FH = 32, ROWS = { down: 0, left: 1, right: 2, up: 3 };
const W = 320, H = 192, TILE = 16;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const NAMES = ['柴田さん', 'chara2'];
const imgs = SHEETS.map(src => { const im = new Image(); im.src = src; return im; });
const me = { i: 0, x: 160, y: 120, dir: 'down', t: 0, moving: false, held: new Set() };
let playing = false;

// animated walk previews on the select cards
const cardCtx = [0, 1].map(i => {
  const c = document.querySelector('#pick-' + i + ' canvas').getContext('2d');
  c.imageSmoothingEnabled = false; return c;
});
const selectEl = document.getElementById('select'), playEl = document.getElementById('play');
function choose(i) {
  me.i = i; me.x = 160; me.y = 120; me.dir = 'down'; me.held.clear();
  document.getElementById('now').textContent = NAMES[i];
  selectEl.hidden = true; playEl.hidden = false; playing = true;
  try { localStorage.setItem('chara', String(i)); } catch (e) {}
}
document.querySelectorAll('.card').forEach(b => b.addEventListener('click', () => choose(+b.dataset.i)));
document.getElementById('change').addEventListener('click', () => {
  playing = false; me.held.clear(); playEl.hidden = true; selectEl.hidden = false;
  document.getElementById('pick-' + me.i).focus();
});

// floor: a fixed pseudo-random tile pattern
const floor = document.createElement('canvas');
floor.width = W; floor.height = H;
(() => {
  const f = floor.getContext('2d');
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let ty = 0; ty < H / TILE; ty++) for (let tx = 0; tx < W / TILE; tx++) {
    f.fillStyle = (tx + ty) % 2 ? '#4a6b45' : '#46663f';
    f.fillRect(tx * TILE, ty * TILE, TILE, TILE);
    for (let k = 0; k < 3; k++) {
      f.fillStyle = rnd() > .5 ? '#55794f' : '#3d5a3a';
      f.fillRect(tx * TILE + (rnd() * 14 | 0), ty * TILE + (rnd() * 14 | 0), 2, 1);
    }
  }
  f.fillStyle = '#8b7d62';
  for (let tx = 0; tx < W / TILE; tx++) f.fillRect(tx * TILE, 0, TILE - 1, 12);
})();

const KEYMAP = {
  KeyW: 'up', KeyA: 'left', KeyS: 'down', KeyD: 'right',
  ArrowUp: 'up', ArrowLeft: 'left', ArrowDown: 'down', ArrowRight: 'right',
};
addEventListener('keydown', e => {
  const d = KEYMAP[e.code]; if (!d || !playing) return;
  e.preventDefault(); me.held.delete(d); me.held.add(d);
});
addEventListener('keyup', e => { const d = KEYMAP[e.code]; if (d) me.held.delete(d); });
addEventListener('blur', () => me.held.clear());

document.querySelectorAll('.pad button').forEach(b => {
  const d = b.dataset.dir;
  const on = e => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); b.classList.add('on'); me.held.delete(d); me.held.add(d); };
  const off = () => { b.classList.remove('on'); me.held.delete(d); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('lostpointercapture', off);
});
const runBox = document.getElementById('run');

const VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
let last = performance.now();
try { const saved = localStorage.getItem('chara'); if (saved !== null) document.getElementById('pick-' + saved)?.classList.add('last'); } catch (e) {}
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const speed = runBox.checked ? 96 : 48;
  const p = me;
  let vx = 0, vy = 0;
  for (const d of p.held) { vx += VEC[d][0]; vy += VEC[d][1]; }
  p.moving = playing && (vx !== 0 || vy !== 0);
  if (p.moving) {
    p.dir = [...p.held].pop();
    const n = Math.hypot(vx, vy);
    p.x = Math.max(FW / 2, Math.min(W - FW / 2, p.x + vx / n * speed * dt));
    p.y = Math.max(28, Math.min(H - 2, p.y + vy / n * speed * dt));
    p.t += dt * (runBox.checked ? 12 : 8);
  } else p.t = 0;

  if (playing) {
    ctx.drawImage(floor, 0, 0);
    const f = p.moving ? Math.floor(p.t) % 4 : 0;
    const dx = Math.round(p.x - FW / 2), dy = Math.round(p.y - FH);
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.fillRect(dx + 5, dy + FH - 2, 10, 2); ctx.fillRect(dx + 4, dy + FH - 1, 12, 1);
    if (imgs[p.i].complete) ctx.drawImage(imgs[p.i], f * FW, ROWS[p.dir] * FH, FW, FH, dx, dy, FW, FH);
  } else {
    const f = Math.floor(now / 125) % 4;
    cardCtx.forEach((c, i) => {
      c.clearRect(0, 0, FW, FH);
      if (imgs[i].complete) c.drawImage(imgs[i], f * FW, 0, FW, FH, 0, 0, FW, FH);
    });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
