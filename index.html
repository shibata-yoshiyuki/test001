<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ドット歩行テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@400;700&display=swap">
<style>
:root {
  --bg: #e9ecef; --panel: #f7f8fa; --ink: #1f2429; --muted: #5d6670;
  --line: #c9cfd6; --accent: #3b82a6; --key: #ffffff; --warn: #b4532a;
  --display: "DotGothic16", "M PLUS 1p", system-ui, sans-serif;
  --body: "M PLUS 1p", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15191d; --panel: #1d2329; --ink: #e6eaee; --muted: #9aa4ae;
    --line: #333c45; --accent: #6fb6d6; --key: #262e35; --warn: #e08a62; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  font: 14px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0; letter-spacing: .02em; }
h2 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin: 0 0 12px; }
.sub { margin: 0; color: var(--muted); font-size: .9rem; }
.box { border: 3px solid var(--ink); background: var(--panel); padding: 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.card {
  display: grid; justify-items: center; gap: 8px; cursor: pointer;
  background: var(--key); border: 2px solid var(--line); padding: 14px 22px 12px;
  font: 700 .9rem var(--body); color: var(--ink); padding: 10px 6px 8px;
}
.card:hover, .card.last { border-color: var(--accent); }
.card canvas { width: 60px; height: 96px; image-rendering: pixelated; background: #46663f; }
.lobby { display: grid; gap: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font: 700 .95rem var(--body); color: var(--ink); background: var(--key);
  border: 2px solid var(--line); padding: 9px 16px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--key); }
.btn:disabled { opacity: .5; cursor: default; }
input[type=text] {
  font: 1.2rem var(--display); letter-spacing: .25em;
  width: 8.5em; padding: 7px 10px; border: 2px solid var(--line); background: var(--key); color: var(--ink);
}
.msg { min-height: 1.6em; margin: 0; font-size: .9rem; color: var(--muted); }
.msg.err { color: var(--warn); }
.link { font: .9rem var(--body); color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
.label { font-size: .75rem; letter-spacing: .08em; color: var(--muted); }
/* full-screen play view: canvas fills the window, HUD floats on top */
.play { position: fixed; inset: 0; z-index: 10; background: #1d4f6e; overflow: hidden; touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.play * { touch-action: none; }
canvas#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }
.hud-top, .hud-bottom {
  position: absolute; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hud-top { top: 0; padding-top: calc(8px + env(safe-area-inset-top, 0px)); justify-content: space-between; }
.hud-bottom { bottom: 0; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); justify-content: flex-end; align-items: flex-end; }
.chip {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 6px;
  background: rgba(16, 22, 28, .72); color: #f1f4f6; border: 1px solid rgba(255,255,255,.18);
  padding: 5px 10px; font: 700 .85rem var(--body); line-height: 1.4;
}
button.chip { cursor: pointer; }
.chip button { font: inherit; color: #9fd3ee; background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
.chip input { margin: 0; }
.code { font-family: var(--display); font-size: 1.15rem; letter-spacing: .15em; font-weight: 400; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; font-weight: 400; font-size: .8rem; }
.plist li { display: flex; gap: 6px; align-items: center; }
.dot { width: 9px; height: 9px; display: inline-block; flex: none; }
.toast {
  position: absolute; left: 50%; top: calc(56px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  max-width: calc(100% - 32px); margin: 0; text-align: center; pointer-events: none;
  background: rgba(16, 22, 28, .78); color: #f1f4f6; padding: 6px 12px; font-size: .85rem; transition: opacity .6s;
}
.toast:empty { display: none; }
.banner {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); margin: 0; pointer-events: none;
  font: 2.4rem/1.2 var(--display); color: #fff; text-align: center; white-space: nowrap;
  text-shadow: 0 3px 0 #000, 0 0 12px rgba(0,0,0,.6); transition: opacity .5s;
}
.banner:empty { display: none; }
.banner.fade { opacity: 0; }
.banner small { display: block; font-size: .5em; white-space: normal; max-width: 92vw; margin: 0 auto; }
#mode-chip { font-weight: 400; color: #ffd98a; }
.atk {
  position: absolute; z-index: 2; width: 84px; height: 84px; border-radius: 50%;
  right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(58px + env(safe-area-inset-bottom, 0px));
  background: rgba(214, 72, 64, .82); color: #fff; border: 3px solid rgba(255,255,255,.75);
  font: 1.05rem var(--display); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
}
.buff { color: #8ff0a4; }
.swap { position: absolute; z-index: 2; right: calc(max(14px, env(safe-area-inset-right, 0px)) + 94px); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
.dialog {
  position: absolute; z-index: 3; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px));
  width: min(640px, calc(100% - 24px)); background: rgba(12, 16, 34, .92); color: #f4f1e6;
  border: 3px solid #e8e2c8; box-shadow: 0 0 0 3px #12162a; padding: 10px 14px 8px; cursor: pointer;
  font: 1.05rem/1.6 var(--display); user-select: none; -webkit-user-select: none; touch-action: none;
}
.dlg-name { color: #ffd98a; font-size: .9rem; min-height: 1.2em; }
.dlg-text { min-height: 3.2em; white-space: pre-wrap; }
.dlg-next { text-align: right; font-size: .7rem; opacity: .75; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .dlg-next { animation: none; } }
.gate {
  position: absolute; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(420px, calc(100% - 24px)); background: rgba(12, 16, 34, .95); color: #f4f1e6;
  border: 3px solid #e8e2c8; padding: 14px; display: grid; gap: 10px;
}
.gate h3 { margin: 0; font: 1.2rem var(--display); }
.gate-list { display: grid; gap: 6px; }
.gate-list button { text-align: left; font: 1rem var(--display); color: #f4f1e6; background: #263055; border: 2px solid #5b6aa8; padding: 8px 10px; cursor: pointer; }
.gate-list button:disabled { opacity: .45; cursor: default; }
.gate-list small { display: block; font: .75rem var(--body); opacity: .85; }
.atk span, .atk small { display: block; line-height: 1.15; }
.atk span { font-size: .95rem; }
.atk small { font: .72rem var(--body); opacity: .9; }
.atk.on { background: rgba(255, 120, 100, .95); transform: scale(.94); }
.atk:disabled { background: rgba(90, 90, 90, .7); }
.life { color: #ff6b6b; letter-spacing: .05em; }
.life.down { color: #c0c6cc; }
.toast.fade { opacity: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>ドット歩行テスト</h1>
    <p class="sub">キャラを選んで部屋を作るか、部屋コードで入ると、最大4人で同じ画面を歩けます。</p>
  </div>

  <!-- 1. character select -->
  <section id="select" class="box">
    <h2>使うキャラを選んでください</h2>
    <div class="cards">
      <!-- cards are built from CHARS in the script -->
    </div>
  </section>

  <!-- 2. lobby -->
  <section id="lobby" class="box" hidden>
    <div class="lobby">
      <div>
        <h2>部屋を作る</h2>
        <div class="row">
          <button class="btn primary" id="create-story">ストーリーモードで作る</button>
          <button class="btn primary" id="create-coop">協力モードで作る</button>
          <button class="btn primary" id="create">対戦モードで作る</button>
        </div>
        <p class="sub">ストーリー：王様の頼みで北の魔王を倒しに行きます。お城から村・草原・森…と歩いて進みます（全4章。みんな別々の場所にいてもOK。進み具合はこのブラウザに保存）。協力：押し寄せる敵のウェーブをみんなで倒します。対戦：プレイヤー同士で撃ち合います。<br>作った人が部屋の親になります。親が抜けると部屋は終了します。</p>
        <p class="sub" id="story-save"></p>
      </div>
      <div>
        <h2>部屋に入る</h2>
        <div class="row">
          <label for="code-in" class="label">部屋コード</label>
          <input type="text" id="code-in" maxlength="4" autocomplete="off" inputmode="numeric" pattern="[0-9]*" placeholder="1234">
          <button class="btn" id="join">入る</button>
        </div>
      </div>
      <p class="msg" id="lobby-msg" role="status"></p>
      <button class="link" id="back">キャラを選び直す</button>
      <a class="link" href="items.html">アイテム素材一覧</a>
      <p class="sub" id="ver"></p>
    </div>
  </section>

</div>

<!-- 3. play (full screen) -->
<section id="play" class="play" hidden>
  <canvas id="game" aria-label="ゲーム画面。タップでその場所へ移動、押したままずらすとその方向へ移動"></canvas>
  <div class="hud-top">
    <div class="chip">部屋 <span class="code" id="room-code"></span> <span id="mode-chip"></span> <button id="copy">招待リンクをコピー</button> <span id="copy-msg" role="status"></span></div>
    <div class="chip"><ul class="plist" id="plist" aria-label="参加者"></ul><span id="count" hidden></span></div>
  </div>
  <p class="toast" id="play-msg" role="status"></p>
  <p class="banner" id="banner" aria-live="polite"></p>
  <button class="atk" id="atk" aria-label="攻撃（スペースキー）"><span id="atk-name">ナイフ</span><small id="atk-ammo"></small></button>
  <button class="chip swap" id="swap" hidden aria-label="武器を持ちかえる（Qキー）">持ちかえ</button>
  <div class="dialog" id="dialog" hidden role="dialog" aria-live="polite">
    <div class="dlg-name" id="dlg-name"></div>
    <div class="dlg-text" id="dlg-text"></div>
    <div class="dlg-next">▼ タップ／スペースで次へ</div>
  </div>
  <div class="hud-bottom">
    <span class="chip buff" id="buff" hidden></span>
    <label class="chip"><input type="checkbox" id="run"> 走る</label>
    <button class="chip" id="zoom">見え方：ふつう</button>
    <button class="chip" id="fs">全画面</button>
    <button class="chip" id="leave">退出</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
// ---------- constants ----------
// To add a character: put <id>_walk.png (20x32 frames, 4x4) in assets/sprites and add a line here.
const CHARS = [
  ['shibata', '柴田さん'], ['cyber', 'サイバー'], ['yami', 'ヤミさん'], ['kitamura', '北村さん'],
  ['yamada', '山田さん'], ['shindo', '新藤さん'], ['takeda', '武田さん'], ['kikuchi', '菊地さん'], ['mabuchi', '馬淵さん'],
];
const SHEETS = CHARS.map(c => 'assets/sprites/' + c[0] + '_walk.png');
const NAMES = CHARS.map(c => c[1]);
(() => {
  const box = document.querySelector('#select .cards');
  CHARS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'card'; b.id = 'pick-' + i; b.dataset.i = String(i);
    const cv = document.createElement('canvas'); cv.width = 20; cv.height = 32;
    const sp = document.createElement('span'); sp.textContent = c[1];
    b.append(cv, sp); box.append(b);
  });
})();
const SLOT_COLORS = ['#e8c547', '#e0644f', '#5aa9e6', '#9b6be0'];   // P1..P4 tags
const FW = 20, FH = 32, ROWS = { down: 0, left: 1, right: 2, up: 3 };
const TILE = 16, MAX = 4;
let MAP_W = 72, MAP_H = 54;                   // current map in tiles (changes with the scene)
let WORLD_W = MAP_W * TILE, WORLD_H = MAP_H * TILE;
const ID_PREFIX = 'dotwalk-shibata-test001-';
const CODE_CHARS = '0123456789';
const VERSION = '2026-11-25g';         // bump on every release; host and guests must match
const SEND_MS = 66, TIMEOUT_MS = 15000, JOIN_TIMEOUT_MS = 25000;
// battle
const LIFE_MAX = 3, SHOT_SPEED = 170, SHOT_RANGE = 150, SHOT_CD = 450, INV_MS = 1000, DOWN_MS = 3000;

const $ = id => document.getElementById(id);
// no zooming: pinch, Safari gestures, Ctrl+wheel and Ctrl +/- / 0 (double-tap zoom is off via touch-action in CSS)
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0', ';'].includes(e.key)) e.preventDefault();
});
$('ver').textContent = 'ページの版：' + VERSION;
// stale-page check: browsers may keep an old copy of this page for a few minutes
if (typeof fetch === 'function') fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => {
  const m = t.match(/const VERSION = '([^']+)'/);
  if (m && m[1] !== VERSION) {
    $('ver').innerHTML = '';
    const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = '新しい版があります。ここを押して再読み込み';
    b.addEventListener('click', () => location.replace(location.pathname + '?v=' + Date.now() + (new URLSearchParams(location.search).get('room') ? '&room=' + new URLSearchParams(location.search).get('room') : '')));
    $('ver').append(b);
    if ($('lobby').hidden && $('select').hidden) toast('新しい版のページがあります。退出してから再読み込みしてください。');
  }
}).catch(() => {});
const imgs = SHEETS.map(src => { const im = new Image(); im.src = src; return im; });

// ---------- state ----------
const me = { c: 0, x: WORLD_W / 2, y: WORLD_H / 2, dir: 'down', m: false, t: 0, held: new Set(), slot: 0,
  life: LIFE_MAX, down: false, inv: false, ko: 0, aimX: 0, aimY: 1, lastShot: -1e9, atkT: -1e9, w: 'knife', ammo: 0, fastUntil: 0 };
const shots = new Map();           // id -> shot  (x,y = point on the ground; drawn 12px higher)
// weapons (icons: 0x72 DungeonTileset II, CC0). kind: melee = arc in front, slam = ring around you, shot = projectile
const WEAPONS = {
  knife:  { name: 'ナイフ',     icon: 'knife',             kind: 'melee', reach: 30, arc: 0.9, cd: 350, dmg: 1 },
  bow:    { name: '弓',         icon: 'bow',               kind: 'shot', spd: 260, rng: 260, cd: 520, dmg: 1, pierce: true, proj: 'arrow' },
  axe:    { name: '投げ斧',     icon: 'throwing_axe',      kind: 'shot', spd: 170, rng: 110, cd: 700, dmg: 2, pierce: true, boomerang: true, proj: 'axe' },
  katana: { name: '刀',         icon: 'katana',            kind: 'melee', reach: 40, arc: 1.7, cd: 450, dmg: 2 },
  hammer: { name: '大ハンマー', icon: 'big_hammer',        kind: 'slam', radius: 50, delay: 260, cd: 1000, dmg: 3 },
  red:    { name: '赤い杖',     icon: 'red_magic_staff',   kind: 'shot', spd: 170, rng: 150, cd: 500, dmg: 1, spread: [-0.3, 0, 0.3], proj: 'orbR' },
  green:  { name: '緑の杖',     icon: 'green_magic_staff', kind: 'shot', spd: 125, rng: 260, cd: 450, dmg: 1, homing: true, proj: 'orbG' },
};
const PICK_WEAPONS = ['bow', 'axe', 'katana', 'hammer', 'red', 'green'];
const WEAPON_USES = 20;
const W_IMGS = {};
for (const k of ['knife', 'bow', 'arrow', 'throwing_axe', 'katana', 'big_hammer', 'red_magic_staff', 'green_magic_staff']) { const im = new Image(); im.src = 'assets/weapons/' + k + '.png'; W_IMGS[k] = im; }
let fx = [];                       // melee / slam effects
const pickups = new Map();         // id -> {id, w, x, y}
let pickSeq = 0, nextPickSpawn = 0, nextItemSpawn = 0;
// one food and one drink (from the おまけ set)
const ITEMS = {
  food:  { name: 'ケーキ',       img: 'pickup_food',  text: 'ライフが1回復！' },
  drink: { name: 'メロンソーダ', img: 'pickup_drink', text: '10秒間、足が速くなる！' },
};
const FAST_MS = 10000, FAST_MULT = 1.6;
const ITEM_IMGS = {}; for (const k in ITEMS) { const im = new Image(); im.src = 'assets/items/' + ITEMS[k].img + '.png'; ITEM_IMGS[k] = im; }
let sparks = [];                   // hit effects
let shotSeq = 0, atkHeld = false;
const stats = new Map();           // host only: slot -> {life, invUntil, down, downUntil, ko}
let mode = 'pvp';                  // 'pvp' | 'coop'
// enemies (assets: 0x72 DungeonTileset II, CC0) — sprites face right; feet at (x, y)
const ENEMY_TYPES = [
  { key: 'swampy',      name: 'スライム',   hp: 1,  spd: 24, fw: 16, fh: 16, sc: 1, hw: 7,  hh: 13 },
  { key: 'goblin',      name: 'ゴブリン',   hp: 1,  spd: 44, fw: 16, fh: 16, sc: 1, hw: 5,  hh: 10 },
  { key: 'skelet',      name: 'ガイコツ',   hp: 3,  spd: 26, fw: 16, fh: 16, sc: 1, hw: 5,  hh: 14 },
  { key: 'necromancer', name: 'まじない師', hp: 2,  spd: 22, fw: 16, fh: 23, sc: 1, hw: 6,  hh: 15, shooter: true },
  { key: 'big_demon',   name: 'ボス',       hp: 30, spd: 20, fw: 32, fh: 36, sc: 2, hw: 22, hh: 56, boss: true },
  // story mid-bosses (guard a treasure chest; drawn at final size, hw/hh already scaled)
  { key: 'ogre',        name: 'オーガ',       hp: 12, spd: 22, fw: 32, fh: 36, sc: 1, hw: 10, hh: 26, mid: true },
  { key: 'masked_orc',  name: 'マスクオーク', hp: 12, spd: 34, fw: 16, fh: 23, sc: 2, hw: 12, hh: 32, mid: true },
  { key: 'big_zombie',  name: 'ゾンビ巨人',   hp: 16, spd: 18, fw: 32, fh: 36, sc: 1, hw: 9,  hh: 26, mid: true },
  { key: 'orc_shaman',  name: 'オーク呪術師', hp: 14, spd: 24, fw: 16, fh: 23, sc: 2, hw: 11, hh: 30, mid: true, shooter: true },
  { key: 'orc_warrior', name: 'オーク兵',     hp: 2,  spd: 34, fw: 16, fh: 23, sc: 1, hw: 5,  hh: 16 },   // 9: attacks the town
];
const ENEMY_IMGS = ENEMY_TYPES.map(t => { const im = new Image(); im.src = 'assets/enemies/' + t.key + '.png'; return im; });
const MAX_ALIVE = 24, ENEMY_BULLET = '#b45cff';
// every wave ends with one boss: that wave's enemy, made big
const LAST_WAVE = 4;
const BOSS_NAMES = ['キングスライム', 'ゴブリンキング', 'ガイコツ大将', '大まじない師', '魔王'];
const BOSS_HP = [14, 16, 20, 16, 36];
BOSS_NAMES[9] = 'オーク隊長'; BOSS_HP[9] = 22;
const WAVE_BOSS = [0, 1, 2, 4];   // wave 1..4 -> enemy type (wave 4 = 魔王, the last boss)
function bossTypeFor(w) { return WAVE_BOSS[(w - 1) % WAVE_BOSS.length]; }
let bossFx = [];                  // quake rings / teleport puffs (everyone)
// size / hit box of an enemy (bosses are drawn 3x, the demon 2x)
function eDims(e) {
  const T = ENEMY_TYPES[e.type];
  if (!e.boss) return { sc: T.sc, hw: T.hw, hh: T.hh, r: T.mid ? 8 : 4 };
  const sc = T.boss ? T.sc : 3, k = sc / T.sc;
  return { sc, hw: T.hw * k, hh: T.hh * k, r: 10 };
}

function createRoom(tries, m) {
  busy(true); lobbyMsg('部屋を作っています…');
  const code = randomCode();
  const p = new Peer(ID_PREFIX + code);
  p.on('open', () => {
    peer = p; isHost = true; roomCode = code; me.slot = 1;
    stats.clear(); stats.set(1, freshStat());
    mode = m;
    game.sq = 0; curSeq = 0; for (const k in AREAS) delete AREAS[k];
    loadScene(m === 'story' ? 'castle' : 'island');
    const sp = spawnPoint(1); me.x = sp.x; me.y = sp.y;
    stats.get(1).sc = curScene;
    if (m === 'story') { const st = stats.get(1); st.cleared = save.cleared; st.owned = new Set(['knife', ...save.weapons]); }
    resetGame();
    p.on('connection', onHostConnection);
    enterPlay();
  });
  p.on('error', err => {
    if (err.type === 'unavailable-id' && tries < 8) { p.destroy(); createRoom(tries + 1, m); return; }
    if (peer === p) { console.warn('peer error (room kept)', err.type); return; }   // already hosting: keep the room, 'disconnected' reconnects
    p.destroy(); busy(false); lobbyMsg(errorText(err.type), true);
  });
  p.on('disconnected', () => { if (peer === p) p.reconnect(); });
}

$('join').addEventListener('click', joinRoom);

function joinRoom() {
  const code = $('code-in').value.replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/\D/g, '');
  if (!/^\d{4}$/.test(code)) { lobbyMsg('部屋コードは4桁の数字です。', true); return; }
  busy(true); lobbyMsg('通信サーバーにつないでいます…');
  const p = new Peer();
  let giveUp = 0, slowMsg = 0;
  p.on('open', () => {
    lobbyMsg('部屋の親につないでいます…');
    const conn = p.connect(ID_PREFIX + code, { reliable: true, metadata: { c: me.c, v: VERSION, sv: { c: save.cleared, w: save.weapons } } });
    slowMsg = setTimeout(() => { if (!hostConn) lobbyMsg('部屋の親につないでいます…（時間がかかっています。親の画面が開いたままか確認してください）'); }, 8000);
    giveUp = setTimeout(() => {
      if (hostConn) return;
      p.destroy(); busy(false);
      lobbyMsg('部屋に入れませんでした。①部屋の親がゲーム画面を開いたままか（別のアプリに切り替えていないか）②部屋コードが合っているか を確認して、もう一度「入る」を押してください。', true);
    }, JOIN_TIMEOUT_MS);
    conn.on('open', () => lobbyMsg('部屋の親とつながりました。準備中…'));
    conn.on('data', d => {
      if (d.sc && hostConn === conn && ['shot', 'atk', 'pick', 'ehit', 'hit', 'bfx', 'respawn'].includes(d.t) && d.sc !== curScene) return;   // news from another place
      if (d.t === 'full') { clearTimeout(giveUp); clearTimeout(slowMsg); p.destroy(); busy(false); lobbyMsg('この部屋は満員です（最大4人）。', true); return; }
      if (d.t === 'version') {
        clearTimeout(giveUp); clearTimeout(slowMsg); p.destroy(); busy(false);
        lobbyMsg('部屋の親とページの版が違います（親：' + d.v + '／あなた：' + VERSION + '）。親もあなたも、ページを再読み込みしてから入り直してください。', true); return;
      }
      if (d.t === 'welcome') {
        clearTimeout(giveUp); clearTimeout(slowMsg);
        peer = p; isHost = false; roomCode = code; hostConn = conn; me.slot = d.slot; mode = ['coop', 'story'].includes(d.mode) ? d.mode : 'pvp';
        loadScene(d.sc || 'island'); curSeq = d.sq | 0;
        me.x = d.x; me.y = d.y; lastHostMsg = performance.now();
        enterPlay();
        return;
      }
      if (d.t === 'all') { lastHostMsg = performance.now(); applyAll(d.ps); if (d.en) applyEnemies(d.en); if (d.g) updateGameUI(d.g); if (d.pk) applyPickups(d.pk); }
      else if (d.t === 'shot') addShot(d, true);
      else if (d.t === 'atk') attackFx(d);
      else if (d.t === 'pick') onPick(d);
      else if (d.t === 'ehit') onEhit(d);
      else if (d.t === 'hit') onHit(d);
      else if (d.t === 'respawn') onRespawn(d);
      else if (d.t === 'bfx') onBossFx(d);
      else if (d.t === 'scene') { loadScene(d.sc); curSeq = d.sq | 0; me.x = d.x; me.y = d.y; me.down = false; }
      else if (d.t === 'sclear') onStoryClear(d);
      else if (d.t === 'note') toast(String(d.text));
      else if (d.t === 'warp') onWarp(d);
    });
    conn.on('close', () => { if (hostConn === conn) endRoom('親が部屋を閉じたため、部屋が終了しました。'); });
  });
  p.on('error', err => {
    if (peer === p) { console.warn('peer error (still in room)', err.type); return; }  // in room: the host timeout decides
    clearTimeout(giveUp); clearTimeout(slowMsg); p.destroy(); busy(false); lobbyMsg(errorText(err.type), true);
  });
}

    if (me.m) {
      me.dir = dir;
      const n = Math.hypot(vx, vy), mx = vx / n * step, my = vy / n * step;
      me.aimX = vx / n; me.aimY = vy / n;
      let moved = false;
      if (canStand(me.x + mx, me.y)) { me.x += mx; moved = moved || Math.abs(mx) > 1e-3; }   // per-axis so you slide along the shore
      if (canStand(me.x, me.y + my)) { me.y += my; moved = moved || Math.abs(my) > 1e-3; }
      if (!moved) { me.m = false; if (target) target = null; }
      me.t += dt * (run ? 12 : 8);
    }
    if (!me.m) me.t = 0;
    if (!canStand(me.x, me.y)) { const sp = spawnPoint(me.slot); me.x = sp.x; me.y = sp.y; }   // safety net: never stuck in the sea
    checkExits(prevX, prevY, now);
    camX = Math.round(me.x - VW / 2); camY = Math.round(me.y - 16 - VH / 2);
    if (atkHeld) fire(undefined, undefined, true);
    if (isHost) {                    // the host runs every place someone is in
      const places = new Set([curScene]);
      for (const sh of shots.values()) places.add(sh.sc || curScene);
      for (const e of enemies.values()) places.add(e.sc);
      for (const sc of places) withMap(sc, () => { stepShots(dt, now); if (mode !== 'pvp') stepEnemies(dt, now); });
    } else stepShots(dt, now);
    if (!isHost) for (const e of enemies.values()) {
      const k = 1 - Math.pow(0.001, dt);
      if (Math.hypot(e.x - e.dx, e.y - e.dy) > 60) { e.dx = e.x; e.dy = e.y; }
      e.dx += (e.x - e.dx) * k; e.dy += (e.y - e.dy) * k;
    }
    $('atk').disabled = me.down;
    const fastLeft = Math.ceil((me.fastUntil - now) / 1000);
    const buffTxt = fastLeft > 0 ? 'はやい！ のこり' + fastLeft + '秒' : '';
    if ($('buff').textContent !== buffTxt) { $('buff').textContent = buffTxt; $('buff').hidden = !buffTxt; }
    interact = null; talkTo = null;
    if (mode === 'story' && !dlgOpen) {
      let best = 30;
      if (KING && Math.hypot(me.x - KING.x, me.y - KING.y) < 36) { interact = 'talk'; talkTo = 'king'; best = 0; }
      for (const n of NPCS) { if (!npcShown(n)) continue; const d = Math.hypot(me.x - n.x, me.y - n.y); if (d < best) { best = d; interact = 'talk'; talkTo = n; } }
      if (WELL && Math.hypot(me.x - WELL.x, me.y - WELL.y) < Math.min(best, 28)) { interact = 'talk'; talkTo = 'well'; }
    }
    const inTown = mode === 'story' && safePlace();
    const wkey = me.w + ':' + me.ammo + ':' + interact + ':' + (talkTo === 'well') + ':' + inTown + ':' + dlgOpen + ':' + mode + ':' + save.weapons.length;
    if (wkey !== lastWeaponKey) {
      lastWeaponKey = wkey;
      if (dlgOpen) { $('atk-name').textContent = 'つぎへ'; $('atk-ammo').textContent = ''; }
      else if (inTown) { $('atk-name').textContent = talkTo === 'well' ? 'しらべる' : interact === 'talk' ? 'はなす' : '－'; $('atk-ammo').textContent = interact ? '' : '人に近づく'; }
      else {
        $('atk-name').textContent = (WEAPONS[me.w] || WEAPONS.knife).name;
        $('atk-ammo').textContent = me.w === 'knife' ? '近くだけ' : mode === 'story' ? 'ずっと使える' : 'のこり ' + me.ammo;
      }
      $('swap').hidden = !(mode === 'story' && !inTown && save.weapons.length > 0);
    }

    // smooth other players toward their latest reported position
    for (const o of others.values()) {
      const k = 1 - Math.pow(0.001, dt);
      if (Math.hypot(o.x - o.dx, o.y - o.dy) > 60) { o.dx = o.x; o.dy = o.y; }
      o.dx += (o.x - o.dx) * k; o.dy += (o.y - o.dy) * k;
      o.t = o.m ? o.t + dt * 8 : 0;
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = THEME.deep; ctx.fillRect(0, 0, VW, VH);         // open sea beyond the map
    ctx.setTransform(1, 0, 0, 1, -camX, -camY);                       // world space
    ctx.drawImage(world, 0, 0);
    drawWaves(now);
    if (target) {   // destination marker
      const tx = Math.round(target.x), ty = Math.round(target.y), b = (now / 300 | 0) % 2;
      ctx.fillStyle = '#fff6c2';
      ctx.fillRect(tx - 3 - b, ty, 2, 1); ctx.fillRect(tx + 2 + b, ty, 2, 1);
      ctx.fillRect(tx, ty - 2 - b, 1, 2); ctx.fillRect(tx, ty + 1 + b, 1, 2);
    }
    const VD = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const list = [
      { c: me.c, x: me.x, y: me.y, dir: me.dir, f: me.m ? Math.floor(me.t) % 4 : 0, slot: me.slot, me: true, fast: now < me.fastUntil,
        p: { life: me.life, down: me.down, inv: me.inv, atkT: me.atkT, ax: me.aimX, ay: me.aimY } },
      ...[...others.values()].filter(o => (o.sc || 'island') === curScene).map(o => ({ c: o.c, x: o.dx, y: o.dy, dir: o.dir, f: o.m ? Math.floor(o.t) % 4 : 0, slot: o.slot, me: false, fast: (o.fs | 0) > 0,
        p: { life: o.life, down: o.down, inv: o.inv, atkT: o.atkT, ax: (VD[o.dir] || [0, 1])[0], ay: (VD[o.dir] || [0, 1])[1] } })),
    ].sort((a, b) => a.y - b.y);
    // shots: shadow on the ground, shot at chest height
    for (const sh of shots.values()) {
      if (sh.sc && sh.sc !== curScene) continue;
      const sx = Math.round(sh.x), sy = Math.round(sh.y), ang = Math.atan2(sh.vy, sh.vx);
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(sx - 2, sy - 1, 5, 2);
      if (sh.proj === 'arrow' || sh.proj === 'axe') {
        const im = W_IMGS[sh.proj === 'arrow' ? 'arrow' : 'throwing_axe'];
        if (im.complete && im.naturalWidth) {
          ctx.save(); ctx.translate(sx, sy - 12);
          ctx.rotate(sh.proj === 'arrow' ? ang + Math.PI / 2 : sh.spin);
          ctx.drawImage(im, -Math.round(im.width / 2), -Math.round(im.height / 2));
          ctx.restore();
        }
        continue;
      }
      const v = Math.hypot(sh.vx, sh.vy) || 1, ux = sh.vx / v, uy = sh.vy / v;
      const col = sh.proj === 'enemy' ? ENEMY_BULLET : sh.proj === 'orbR' ? '#ff5a4f' : sh.proj === 'orbG' ? '#5fe07a' : (SLOT_COLORS[sh.slot - 1] || '#fff');
      ctx.fillStyle = col;
      ctx.globalAlpha = .45; ctx.fillRect(Math.round(sx - ux * 5) - 1, Math.round(sy - 12 - uy * 5) - 1, 3, 3);
      ctx.globalAlpha = 1;
      ctx.fillRect(sx - 2, sy - 14, 5, 5);
      ctx.fillStyle = '#fff'; ctx.fillRect(sx - 1, sy - 13, 3, 3);
    }
    bossFx = bossFx.filter(b => now - b.t < (b.k === 'mark' ? 1000 : 450));
    for (const b of bossFx) {
      if (b.k === 'mark') {                       // a torch is about to land here
        const q = Math.max(0, Math.min(1, (now - b.t) / 1000));
        ctx.save(); ctx.globalAlpha = .25 + .35 * q + .15 * ((now / 90 | 0) % 2);
        ctx.fillStyle = '#ff5a2a'; ctx.beginPath(); ctx.ellipse(b.x, b.y, 26, 18, 0, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1; ctx.strokeStyle = '#ffd34a'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(b.x, b.y, 26 * q, 18 * q, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore(); continue;
      }
      const p = Math.max(0, (now - b.t) / 450);
      ctx.save(); ctx.globalAlpha = 1 - p;
      if (b.k === 'boom') {
        for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, r = 4 + 24 * p; ctx.fillStyle = i % 2 ? '#ffd34a' : '#ff6a2a'; ctx.fillRect(Math.round(b.x + Math.cos(a) * r) - 2, Math.round(b.y - 6 + Math.sin(a) * r * .7) - 2, 4, 4); }
      }
      else if (b.k === 'quake') { ctx.strokeStyle = '#d7ff8a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(b.x, b.y, 10 + 40 * p, (10 + 40 * p) * .6, 0, 0, Math.PI * 2); ctx.stroke(); }
      else if (b.k === 'tele' || b.k === 'summon' || b.k === 'rage') {
        ctx.fillStyle = b.k === 'summon' ? '#cfd8ff' : '#c45cff';
        for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, r = 6 + 26 * p; ctx.fillRect(Math.round(b.x + Math.cos(a) * r) - 1, Math.round(b.y - 20 + Math.sin(a) * r * .7) - 1, 3, 3); }
      }
      ctx.restore();
    }
    // melee arcs and hammer shockwaves
    fx = fx.filter(f => now - f.t < (f.kind === 'slam' ? WEAPONS[f.w].delay + 260 : 170));
    for (const f of fx) {
      if (f.sc && f.sc !== curScene) continue;
      const W = WEAPONS[f.w], k = (now - f.t);
      const o = f.slot === me.slot ? me : otherBySlot(f.slot);
      const cx = f.kind === 'slam' && o ? (o === me ? me.x : o.dx) : f.x, cy = (f.kind === 'slam' && o ? (o === me ? me.y : o.dy) : f.y) - 12;
      ctx.save();
      if (f.kind === 'melee') {
        const p = k / 170, r = W.reach * (0.65 + 0.35 * p);
        ctx.globalAlpha = 1 - p; ctx.strokeStyle = f.w === 'katana' ? '#d8f6ff' : '#ffffff'; ctx.lineWidth = f.w === 'katana' ? 3 : 2;
        const a0 = f.base - W.arc, a1 = f.base - W.arc + (W.arc * 2) * Math.min(1, p * 1.8);
        ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
      } else if (k >= W.delay) {
        const p = (k - W.delay) / 260;
        ctx.globalAlpha = 1 - p; ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(cx, cy + 10, W.radius * (0.3 + 0.7 * p), W.radius * (0.3 + 0.7 * p) * .6, 0, 0, Math.PI * 2); ctx.stroke();
      } else {                     // wind-up: hammer raised
        const im = W_IMGS.big_hammer;
        if (im.complete) { ctx.translate(cx, cy - 6); ctx.rotate(-0.6 + k / W.delay * 1.2); ctx.drawImage(im, -5, -30, 10, 37); }
      }
      ctx.restore();
    }
    const drawables = list.map(p => ({ y: p.y, draw: () => { if (p.fast && p.f % 2 === 1) drawSpeedTrail(p.x, p.y, now); drawChar(p.c, p.x, p.y, p.dir, p.f, p.slot, p.me, p.p); } }));
    for (const e of enemies.values()) {
      if (isHost && e.sc !== curScene) continue;
      const ex = isHost ? e.x : e.dx, ey = isHost ? e.y : e.dy;
      drawables.push({ y: ey, draw: () => drawEnemy(e, ex, ey, now) });
    }
    pushObstacleDrawables(drawables);
    if (KING) drawables.push({ y: KING.y, draw: () => {
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(KING.x - 6, KING.y - 1, 12, 2);
      if (KING_IMG.complete && KING_IMG.naturalWidth) ctx.drawImage(KING_IMG, (Math.floor(now / 250) % 4) * 16, 0, 16, 28, KING.x - 8, KING.y - 27, 16, 28);
      if (talkTo === 'king' || !save.talked) { const b = (now / 300 | 0) % 2; ctx.fillStyle = '#fff'; ctx.fillRect(KING.x + 6, KING.y - 38 - b, 9, 7); ctx.fillStyle = '#222'; ctx.fillRect(KING.x + 8, KING.y - 35 - b, 1, 1); ctx.fillRect(KING.x + 10, KING.y - 35 - b, 1, 1); ctx.fillRect(KING.x + 12, KING.y - 35 - b, 1, 1); }
    } });
    if (mode === 'story' && storyPh === 'done' && PORTAL && FIELD_CH[curScene]) drawables.push({ y: PORTAL.y - 8, draw: () => {
      ctx.save();
      for (let i = 0; i < 3; i++) {
        const p = ((now / 900) + i / 3) % 1;
        ctx.globalAlpha = 1 - p; ctx.strokeStyle = i % 2 ? '#c9a8ff' : '#ffffff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(PORTAL.x, PORTAL.y, 6 + 12 * p, (6 + 12 * p) * .55, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = .5; ctx.fillStyle = '#b48cff'; ctx.beginPath(); ctx.ellipse(PORTAL.x, PORTAL.y, 10, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } });
    for (const pk of pickups.values()) if (!pk.sc || pk.sc === curScene) drawables.push({ y: pk.y, draw: () => drawPickup(pk, now) });
    const burning = mode === 'story' && SCENES[curScene].town && storyPh && storyPh !== 'done';
    for (const H of HOUSES) { const im = HOUSE_SPRITES[H.v]; drawables.push({ y: H.y, draw: () => {
      ctx.drawImage(im, Math.round(H.x - 24), H.y - 45);
      if (burning && H.burn) for (let i = 0; i < 7; i++) {            // the town is on fire
        const ph = (now / 120 + i * 1.7) % 6, fx = Math.round(H.x - 14 + i * 4 + Math.sin(now / 200 + i) * 2), fy = Math.round(H.y - 36 - ph * 2);
        ctx.fillStyle = ph < 2 ? '#ffe066' : ph < 4 ? '#ff8a2a' : '#d23a1a'; ctx.fillRect(fx, fy, 3, 4 - (ph / 2 | 0));
        ctx.fillStyle = 'rgba(60, 60, 60, .45)'; ctx.fillRect(fx + 1, Math.round(H.y - 50 - ((now / 60 + i * 13) % 30)), 3, 3);
      }
    } }); }
    if (WELL) drawables.push({ y: WELL.y, draw: () => {
      const x = WELL.x, y = WELL.y, open = save.cleared >= KEY_CH;
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x - 9, y - 1, 18, 2);
      ctx.fillStyle = '#7d8288'; ctx.fillRect(x - 8, y - 10, 16, 10); ctx.fillStyle = '#9ea3aa'; ctx.fillRect(x - 8, y - 10, 16, 2);
      ctx.fillStyle = '#5d6168'; for (let i = 0; i < 4; i++) ctx.fillRect(x - 8 + i * 4, y - 6, 1, 6);
      ctx.fillStyle = open ? ((now / 200 | 0) % 2 ? '#7a3bd1' : '#5a2aa0') : '#1b1d22'; ctx.fillRect(x - 6, y - 12, 12, 3);
      ctx.fillStyle = '#6b4a2b'; ctx.fillRect(x - 8, y - 24, 2, 14); ctx.fillRect(x + 6, y - 24, 2, 14); ctx.fillStyle = '#8a3a2a'; ctx.fillRect(x - 10, y - 26, 20, 3);
      if (open) { ctx.fillStyle = 'rgba(190, 120, 255, .55)'; for (let i = 0; i < 4; i++) { const k = (now / 400 + i / 4) % 1; ctx.fillRect(Math.round(x - 4 + i * 3), Math.round(y - 12 - k * 16), 2, 2); } }
      if (talkTo === 'well' || open) { const b = (now / 300 | 0) % 2; ctx.fillStyle = open ? '#e8c547' : '#fff'; ctx.fillRect(x - 1, y - 38 - b, 3, 6); ctx.fillRect(x - 1, y - 30 - b, 3, 2); }
    } });
    for (const n of NPCS) if (npcShown(n)) drawables.push({ y: n.y, draw: () => {
      const im = NPC_IMGS[n.k]; ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(n.x - 6, n.y - 1, 12, 2);
      if (im && im.complete && im.naturalWidth) { const fh = im.height; ctx.drawImage(im, (Math.floor(now / 250 + n.tx) % 4) * 16, 0, 16, fh, n.x - 8, n.y - fh + 1, 16, fh); }
      if (talkTo === n) { const b = (now / 300 | 0) % 2, top = n.y - (im && im.height || 28) - 8 - b; ctx.fillStyle = '#fff'; ctx.fillRect(n.x + 4, top, 9, 7); ctx.fillStyle = '#222'; ctx.fillRect(n.x + 6, top + 3, 1, 1); ctx.fillRect(n.x + 8, top + 3, 1, 1); ctx.fillRect(n.x + 10, top + 3, 1, 1); }
    } });
    if (mode === 'story') for (const ex of EXITS) {          // a signpost beside every way out
      if (!ex.ent) continue;
      const ns = ex.side === 'n' || ex.side === 's', sx = Math.round(ex.ent.x + (ns ? 30 : 0)), sy = Math.round(ex.ent.y + (ns ? 0 : -26));
      drawables.push({ y: sy, draw: () => {
        const name = PLACE_NAME[ex.to] || '', locked = ex.need && save.cleared < ex.need;
        ctx.font = 'bold 8px sans-serif'; const tw = Math.ceil((ctx.measureText(name) || {}).width || name.length * 8) + 6;
        ctx.fillStyle = '#5a3d22'; ctx.fillRect(sx - 1, sy - 12, 2, 12);
        ctx.fillStyle = '#4a321d'; ctx.fillRect(sx - tw / 2 - 1, sy - 24, tw + 2, 13);
        ctx.fillStyle = locked ? '#9a8a76' : '#e2c48e'; ctx.fillRect(sx - tw / 2, sy - 23, tw, 11);
        ctx.fillStyle = locked ? '#5d5246' : '#3b2614'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(name, sx, sy - 17);
        ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
      } });
    }
    if (mode === 'story' && !dlgOpen && !me.down) { const gt = guideTarget(); if (gt) {   // the yellow arrow: which way to go next
      const dx = gt.x - me.x, dy = gt.y - me.y, d = Math.hypot(dx, dy);
      if (d > 36) drawables.push({ y: 1e9, draw: () => {
        const a = Math.atan2(dy, dx), b = 26 + Math.sin(now / 160) * 3, ax = me.x + Math.cos(a) * b, ay = me.y - 12 + Math.sin(a) * b;
        ctx.save(); ctx.translate(Math.round(ax), Math.round(ay)); ctx.rotate(a);
        ctx.fillStyle = '#3b2a05'; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-5, -7); ctx.lineTo(-2, 0); ctx.lineTo(-5, 7); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-4, -5); ctx.lineTo(-1, 0); ctx.lineTo(-4, 5); ctx.closePath(); ctx.fill();
        ctx.restore();
      } });
    } }
    if (mode === 'story') for (const ex of EXITS) {          // exits: arrows, and a fence while locked for you
      const locked = ex.need && save.cleared < ex.need, mx = (ex.x0 + ex.x1) / 2, my = (ex.y0 + ex.y1) / 2;
      if (locked) drawables.push({ y: ex.y1, draw: () => {
        const vertical = ex.side === 'e' || ex.side === 'w', fx0 = ex.side === 'e' ? ex.x0 + 4 : ex.side === 'w' ? ex.x1 - 8 : ex.x0, fy0 = ex.side === 's' ? ex.y0 + 4 : ex.side === 'n' ? ex.y1 - 8 : ex.y0;
        ctx.fillStyle = '#5a3d22';
        if (vertical) { ctx.fillRect(fx0, fy0, 3, ex.y1 - ex.y0); ctx.fillRect(fx0 - 3, fy0 + 8, 9, 2); ctx.fillRect(fx0 - 3, ex.y1 - 12, 9, 2); for (let y = fy0; y < ex.y1; y += 8) { ctx.fillStyle = '#8a6338'; ctx.fillRect(fx0 - 1, y, 5, 6); ctx.fillStyle = '#5a3d22'; } }
        else { ctx.fillRect(fx0, fy0, ex.x1 - ex.x0, 3); for (let x = fx0; x < ex.x1; x += 8) { ctx.fillStyle = '#8a6338'; ctx.fillRect(x, fy0 - 4, 5, 9); ctx.fillStyle = '#5a3d22'; } }
      } });
      else { const b = (now / 400 | 0) % 2, dx = ex.side === 'e' ? 1 : ex.side === 'w' ? -1 : 0, dy = ex.side === 's' ? 1 : ex.side === 'n' ? -1 : 0;
        ctx.fillStyle = 'rgba(255, 248, 200, .8)';
        for (let i = 0; i < 3; i++) { const ax = Math.round(mx + dx * (b * 2) - dx * 6), ay = Math.round(my + dy * (b * 2) - dy * 6); ctx.fillRect(ax + dx * i - Math.abs(dy) * i, ay + dy * i - Math.abs(dx) * i, 1 + Math.abs(dy) * i * 2, 1 + Math.abs(dx) * i * 2); } }
    }
    drawables.sort((a, b) => a.y - b.y).forEach(d => d.draw());
    sparks = sparks.filter(sp => now - sp.t < 300);
    for (const sp of sparks) {
      const k = (now - sp.t) / 300, r = 3 + k * 7;
      ctx.fillStyle = 'rgba(' + (sp.col || '255, 245, 200') + ',' + (1 - k).toFixed(2) + ')';
      for (let a = 0; a < 8; a++) ctx.fillRect(Math.round(sp.x + Math.cos(a * Math.PI / 4) * r) - 1, Math.round(sp.y + Math.sin(a * Math.PI / 4) * r) - 1, 2, 2);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);                               // screen space
    if (stick) {    // virtual stick
      ctx.save();
      ctx.globalAlpha = .55; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_R, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = .8; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(stick.kx, stick.ky, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if (typeof Peer === 'undefined') {
  $('create').disabled = $('create-coop').disabled = $('create-story').disabled = $('join').disabled = true;
  lobbyMsg('通信用の部品を読み込めませんでした。ページを再読み込みしてください。', true);
}
</script>
