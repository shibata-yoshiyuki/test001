<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドット歩行テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@400;700&display=swap">
<style>
:root {
  --bg: #e9ecef; --panel: #f7f8fa; --ink: #1f2429; --muted: #5d6670;
  --line: #c9cfd6; --accent: #3b82a6; --key: #ffffff; --warn: #b4532a;
  --display: "DotGothic16", "M PLUS 1p", system-ui, sans-serif;
  --body: "M PLUS 1p", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15191d; --panel: #1d2329; --ink: #e6eaee; --muted: #9aa4ae;
    --line: #333c45; --accent: #6fb6d6; --key: #262e35; --warn: #e08a62; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 14px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0; letter-spacing: .02em; }
h2 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin: 0 0 12px; }
.sub { margin: 0; color: var(--muted); font-size: .9rem; }
.box { border: 3px solid var(--ink); background: var(--panel); padding: 20px; }
.cards { display: flex; flex-wrap: wrap; gap: 14px; }
.card {
  display: grid; justify-items: center; gap: 8px; cursor: pointer;
  background: var(--key); border: 2px solid var(--line); padding: 14px 22px 12px;
  font: 700 1rem var(--body); color: var(--ink);
}
.card:hover, .card.last { border-color: var(--accent); }
.card canvas { width: 80px; height: 128px; image-rendering: pixelated; background: #46663f; }
.lobby { display: grid; gap: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font: 700 .95rem var(--body); color: var(--ink); background: var(--key);
  border: 2px solid var(--line); padding: 9px 16px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--key); }
.btn:disabled { opacity: .5; cursor: default; }
input[type=text] {
  font: 1.2rem var(--display); letter-spacing: .25em;
  width: 8.5em; padding: 7px 10px; border: 2px solid var(--line); background: var(--key); color: var(--ink);
}
.msg { min-height: 1.6em; margin: 0; font-size: .9rem; color: var(--muted); }
.msg.err { color: var(--warn); }
.link { font: .9rem var(--body); color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
.hud { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: .9rem; }
.code { font-family: var(--display); font-size: 1.4rem; letter-spacing: .2em; }
.stage { border: 3px solid var(--ink); background: #3d5a3a; }
canvas#game { display: block; width: 100%; height: auto; image-rendering: pixelated; touch-action: none; }
.controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: space-between; }
.side { display: grid; gap: 8px; min-width: 0; }
.label { font-size: .75rem; letter-spacing: .08em; color: var(--muted); }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.plist li { display: flex; gap: 8px; align-items: center; }
.dot { width: 10px; height: 10px; display: inline-block; }
kbd {
  font-family: var(--display); font-size: .85rem; color: var(--ink);
  background: var(--key); border: 1px solid var(--line); border-bottom-width: 3px; padding: 0 6px;
}
.pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; user-select: none; -webkit-user-select: none; }
.pad button { font: 1.2rem var(--display); color: var(--ink); background: var(--key); border: 2px solid var(--line); cursor: pointer; touch-action: none; }
.pad button.on { background: var(--accent); color: var(--key); border-color: var(--accent); }
.pad .u { grid-column: 2; grid-row: 1; } .pad .l { grid-column: 1; grid-row: 2; }
.pad .r { grid-column: 3; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 3; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>ドット歩行テスト</h1>
    <p class="sub">キャラを選んで部屋を作るか、部屋コードで入ると、最大4人で同じ画面を歩けます。</p>
  </div>

  <!-- 1. character select -->
  <section id="select" class="box">
    <h2>使うキャラを選んでください</h2>
    <div class="cards">
      <button class="card" id="pick-0" data-i="0"><canvas width="20" height="32"></canvas><span>柴田さん</span></button>
      <button class="card" id="pick-1" data-i="1"><canvas width="20" height="32"></canvas><span>サイバー</span></button>
    </div>
  </section>

  <!-- 2. lobby -->
  <section id="lobby" class="box" hidden>
    <div class="lobby">
      <div>
        <h2>部屋を作る</h2>
        <div class="row">
          <button class="btn primary" id="create">新しい部屋を作る</button>
          <span class="sub">作った人が部屋の親になります。親が抜けると部屋は終了します。</span>
        </div>
      </div>
      <div>
        <h2>部屋に入る</h2>
        <div class="row">
          <label for="code-in" class="label">部屋コード</label>
          <input type="text" id="code-in" maxlength="4" autocomplete="off" inputmode="numeric" pattern="[0-9]*" placeholder="1234">
          <button class="btn" id="join">入る</button>
        </div>
      </div>
      <p class="msg" id="lobby-msg" role="status"></p>
      <button class="link" id="back">キャラを選び直す</button>
    </div>
  </section>

  <!-- 3. play -->
  <section id="play" hidden>
    <div class="wrap">
      <div class="hud">
        <span>部屋コード <span class="code" id="room-code"></span></span>
        <button class="btn" id="copy">招待リンクをコピー</button>
        <span id="copy-msg" class="sub" role="status"></span>
      </div>
      <div class="stage"><canvas id="game" width="320" height="192"></canvas></div>
      <p class="msg" id="play-msg" role="status"></p>
      <div class="controls">
        <div class="side">
          <span class="label">参加者 <span id="count"></span></span>
          <ul class="plist" id="plist"></ul>
          <div class="sub">画面をタップ（クリック）するとその場所へ移動。<br>押したまま上下左右にずらすと、その方向へ移動。<br><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> と十字ボタンでも動けます。</div>
          <label class="sub"><input type="checkbox" id="run"> 走る（2倍速）</label>
          <button class="link" id="leave">部屋から出る</button>
        </div>
        <div class="pad" aria-label="十字ボタン">
          <button class="u" data-dir="up" aria-label="上">▲</button>
          <button class="l" data-dir="left" aria-label="左">◀</button>
          <button class="r" data-dir="right" aria-label="右">▶</button>
          <button class="d" data-dir="down" aria-label="下">▼</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
// ---------- constants ----------
const SHEETS = ['assets/sprites/shibata_walk.png', 'assets/sprites/cyber_walk.png'];
const NAMES = ['柴田さん', 'サイバー'];
const SLOT_COLORS = ['#e8c547', '#e0644f', '#5aa9e6', '#9b6be0'];   // P1..P4 tags
const FW = 20, FH = 32, ROWS = { down: 0, left: 1, right: 2, up: 3 };
const W = 320, H = 192, TILE = 16, MAX = 4;
const ID_PREFIX = 'dotwalk-shibata-test001-';
const CODE_CHARS = '0123456789';
const SEND_MS = 66, TIMEOUT_MS = 6000;

const $ = id => document.getElementById(id);
const imgs = SHEETS.map(src => { const im = new Image(); im.src = src; return im; });

// ---------- state ----------
const me = { c: 0, x: 160, y: 120, dir: 'down', m: false, t: 0, held: new Set(), slot: 0 };
let screen = 'select';
let peer = null, isHost = false, roomCode = '';
let hostConn = null;               // client side: connection to host
const conns = new Map();           // host side: peerId -> {conn, slot, last}
let others = new Map();            // key -> {slot,c,x,y,dir,m, dx,dy,t}
let lastHostMsg = 0;

function show(name) {
  screen = name;
  $('select').hidden = name !== 'select';
  $('lobby').hidden = name !== 'lobby';
  $('play').hidden = name !== 'play';
}
function lobbyMsg(text, err) { const el = $('lobby-msg'); el.textContent = text; el.classList.toggle('err', !!err); }

// ---------- 1. select ----------
const cardCtx = [0, 1].map(i => { const c = document.querySelector('#pick-' + i + ' canvas').getContext('2d'); c.imageSmoothingEnabled = false; return c; });
try { const s = localStorage.getItem('chara'); if (s !== null) $('pick-' + s)?.classList.add('last'); } catch (e) {}
document.querySelectorAll('.card').forEach(b => b.addEventListener('click', () => {
  me.c = +b.dataset.i;
  try { localStorage.setItem('chara', String(me.c)); } catch (e) {}
  show('lobby'); lobbyMsg('');
  const q = new URLSearchParams(location.search).get('room');
  if (q) { $('code-in').value = q.replace(/\D/g, '').slice(0, 4); $('join').focus(); }
}));
$('back').addEventListener('click', () => show('select'));

// ---------- 2. lobby / networking ----------
function randomCode() { let s = ''; for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.random() * CODE_CHARS.length | 0]; return s; }
function busy(b) { $('create').disabled = b; $('join').disabled = b; }

function errorText(type) {
  return ({
    'peer-unavailable': 'その部屋コードの部屋が見つかりません。コードを確認するか、部屋が開いているか親に確認してください。',
    'network': '通信サーバーにつながりません。ネットワークを確認してもう一度試してください。',
    'server-error': '通信サーバーでエラーが起きました。少し待ってからもう一度試してください。',
    'browser-incompatible': 'このブラウザは対応していません。Chrome・Safari・Edgeの最新版で開いてください。',
  })[type] || '接続できませんでした（' + type + '）。もう一度試してください。';
}

$('create').addEventListener('click', () => createRoom(0));
function createRoom(tries) {
  busy(true); lobbyMsg('部屋を作っています…');
  const code = randomCode();
  const p = new Peer(ID_PREFIX + code);
  p.on('open', () => {
    peer = p; isHost = true; roomCode = code; me.slot = 1;
    p.on('connection', onHostConnection);
    enterPlay();
  });
  p.on('error', err => {
    if (err.type === 'unavailable-id' && tries < 8) { p.destroy(); createRoom(tries + 1); return; }
    if (peer === p) { console.warn('peer error (room kept)', err.type); return; }   // already hosting: keep the room, 'disconnected' reconnects
    p.destroy(); busy(false); lobbyMsg(errorText(err.type), true);
  });
  p.on('disconnected', () => { if (peer === p) p.reconnect(); });
}

$('join').addEventListener('click', joinRoom);
$('code-in').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
function joinRoom() {
  const code = $('code-in').value.replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/\D/g, '');
  if (!/^\d{4}$/.test(code)) { lobbyMsg('部屋コードは4桁の数字です。', true); return; }
  busy(true); lobbyMsg('部屋に入っています…');
  const p = new Peer();
  let giveUp = 0;
  p.on('open', () => {
    const conn = p.connect(ID_PREFIX + code, { reliable: true, metadata: { c: me.c } });
    giveUp = setTimeout(() => { if (!hostConn) { p.destroy(); busy(false); lobbyMsg('部屋に入れませんでした。コードを確認してもう一度試してください。', true); } }, 10000);
    conn.on('data', d => {
      if (d.t === 'full') { clearTimeout(giveUp); p.destroy(); busy(false); lobbyMsg('この部屋は満員です（最大4人）。', true); return; }
      if (d.t === 'welcome') {
        clearTimeout(giveUp);
        peer = p; isHost = false; roomCode = code; hostConn = conn; me.slot = d.slot;
        me.x = d.x; me.y = d.y; lastHostMsg = performance.now();
        enterPlay();
        return;
      }
      if (d.t === 'all') { lastHostMsg = performance.now(); applyAll(d.ps); }
    });
    conn.on('close', () => { if (hostConn === conn) endRoom('親が部屋を閉じたため、部屋が終了しました。'); });
  });
  p.on('error', err => {
    if (peer === p) { console.warn('peer error (still in room)', err.type); return; }  // in room: the host timeout decides
    clearTimeout(giveUp); p.destroy(); busy(false); lobbyMsg(errorText(err.type), true);
  });
}

// host side
function freeSlot() { const used = new Set([1, ...[...conns.values()].map(v => v.slot)]); for (let s = 1; s <= MAX; s++) if (!used.has(s)) return s; return 0; }
function onHostConnection(conn) {
  conn.on('open', () => {
    const slot = freeSlot();
    if (!slot) { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 500); return; }
    const st = { slot, c: (conn.metadata && conn.metadata.c) | 0, x: 60 + slot * 50, y: 120, dir: 'down', m: false };
    conns.set(conn.peer, { conn, slot, last: performance.now() });
    others.set(conn.peer, { ...st, dx: st.x, dy: st.y, t: 0 });
    conn.send({ t: 'welcome', slot, x: st.x, y: st.y });
    renderList();
  });
  conn.on('data', d => {
    const rec = conns.get(conn.peer); if (!rec || d.t !== 's') return;
    rec.last = performance.now();
    const o = others.get(conn.peer);
    if (o) Object.assign(o, { c: d.c | 0, x: +d.x, y: +d.y, dir: ROWS[d.dir] !== undefined ? d.dir : 'down', m: !!d.m });
  });
  const drop = () => { if (conns.delete(conn.peer)) { others.delete(conn.peer); renderList(); } };
  conn.on('close', drop);
  conn.on('error', drop);
}

// client side: replace the roster with the host's snapshot
function applyAll(ps) {
  const next = new Map();
  for (const p of ps) {
    if (p.slot === me.slot) continue;
    const key = 's' + p.slot, prev = others.get(key);
    next.set(key, { ...p, dx: prev ? prev.dx : p.x, dy: prev ? prev.dy : p.y, t: prev ? prev.t : 0 });
  }
  const changed = next.size !== others.size || [...next.keys()].some(k => !others.has(k));
  others = next;
  if (changed) renderList();
}

function myState() { return { slot: me.slot, c: me.c, x: Math.round(me.x * 10) / 10, y: Math.round(me.y * 10) / 10, dir: me.dir, m: me.m }; }
setInterval(() => {
  if (screen !== 'play' || !peer) return;
  const now = performance.now();
  if (isHost) {
    for (const [id, rec] of conns) if (now - rec.last > TIMEOUT_MS) { rec.conn.close(); conns.delete(id); others.delete(id); renderList(); }
    const ps = [myState(), ...[...others.values()].map(o => ({ slot: o.slot, c: o.c, x: o.x, y: o.y, dir: o.dir, m: o.m }))];
    for (const { conn } of conns.values()) if (conn.open) conn.send({ t: 'all', ps });
  } else if (hostConn) {
    if (now - lastHostMsg > TIMEOUT_MS) { endRoom('親との通信が途切れたため、部屋から出ました。'); return; }
    if (hostConn.open) hostConn.send({ t: 's', ...myState() });
  }
}, SEND_MS);

function enterPlay() {
  busy(false);
  $('room-code').textContent = roomCode;
  $('copy-msg').textContent = '';
  $('play-msg').textContent = isHost ? 'この部屋コードか招待リンクを、一緒に遊ぶ人に送ってください。' : '';
  history.replaceState(null, '', '?room=' + roomCode);
  renderList();
  show('play');
}

function endRoom(msg) {
  const p = peer;
  peer = null; hostConn = null; isHost = false;
  conns.clear(); others = new Map(); me.held.clear(); target = null; stick = null; ptr = null;
  if (p) try { p.destroy(); } catch (e) {}
  history.replaceState(null, '', location.pathname);
  busy(false); show('lobby'); lobbyMsg(msg || '', !!msg);
}
$('leave').addEventListener('click', () => endRoom(''));
addEventListener('pagehide', () => { if (peer) try { peer.destroy(); } catch (e) {} });

$('copy').addEventListener('click', () => {
  const url = location.origin + location.pathname + '?room=' + roomCode;
  const done = () => $('copy-msg').textContent = 'コピーしました';
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => $('copy-msg').textContent = url);
  else $('copy-msg').textContent = url;
});

function renderList() {
  const all = [{ slot: me.slot, c: me.c, you: true }, ...[...others.values()]].sort((a, b) => a.slot - b.slot);
  $('count').textContent = all.length + ' / ' + MAX;
  $('plist').replaceChildren(...all.map(p => {
    const li = document.createElement('li');
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = SLOT_COLORS[p.slot - 1];
    li.append(dot, 'P' + p.slot + '　' + NAMES[p.c] + (p.you ? '（あなた）' : '') + (p.slot === 1 ? '・親' : ''));
    return li;
  }));
}

// ---------- 3. play: input ----------
const KEYMAP = { KeyW: 'up', KeyA: 'left', KeyS: 'down', KeyD: 'right', ArrowUp: 'up', ArrowLeft: 'left', ArrowDown: 'down', ArrowRight: 'right' };
addEventListener('keydown', e => {
  const d = KEYMAP[e.code]; if (!d || screen !== 'play') return;
  if (e.target instanceof HTMLInputElement && e.target.type === 'text') return;
  e.preventDefault(); me.held.delete(d); me.held.add(d);
});
addEventListener('keyup', e => { const d = KEYMAP[e.code]; if (d) me.held.delete(d); });
addEventListener('blur', () => me.held.clear());
document.querySelectorAll('.pad button').forEach(b => {
  const d = b.dataset.dir;
  const on = e => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); b.classList.add('on'); me.held.delete(d); me.held.add(d); };
  const off = () => { b.classList.remove('on'); me.held.delete(d); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
});

// tap = walk to that spot / press and slide = virtual stick (mouse and touch)
const cv = $('game'), ctx = cv.getContext('2d');
const TAP_MS = 350, DRAG_PX = 12, DEAD_PX = 6, STICK_R = 14;
let ptr = null;        // active pointer on the stage
let target = null;     // {x, y} in game pixels
let stick = null;      // {ox, oy, vx, vy, kx, ky} in game pixels
function toGame(e) {
  const r = cv.getBoundingClientRect(), k = W / r.width;
  return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k, k };
}
cv.addEventListener('pointerdown', e => {
  if (screen !== 'play' || ptr || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault(); cv.setPointerCapture?.(e.pointerId);
  ptr = { id: e.pointerId, sx: e.clientX, sy: e.clientY, t0: performance.now(), drag: false };
});
cv.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const ddx = e.clientX - ptr.sx, ddy = e.clientY - ptr.sy, len = Math.hypot(ddx, ddy);
  if (!ptr.drag && len > DRAG_PX) { ptr.drag = true; target = null; }
  if (!ptr.drag) return;
  const g0 = toGame({ clientX: ptr.sx, clientY: ptr.sy }), kk = Math.min(len * g0.k, STICK_R) / (len || 1);
  stick = {
    ox: g0.x, oy: g0.y,
    vx: len > DEAD_PX ? ddx / len : 0, vy: len > DEAD_PX ? ddy / len : 0,
    kx: g0.x + ddx * kk, ky: g0.y + ddy * kk,
  };
});
function endPointer(e, tapAllowed) {
  if (!ptr || e.pointerId !== ptr.id) return;
  if (tapAllowed && !ptr.drag && performance.now() - ptr.t0 < TAP_MS) {
    const g = toGame(e);
    target = { x: Math.max(FW / 2, Math.min(W - FW / 2, g.x)), y: Math.max(28, Math.min(H - 2, g.y)) };
  }
  ptr = null; stick = null;
}
cv.addEventListener('pointerup', e => endPointer(e, true));
cv.addEventListener('pointercancel', e => endPointer(e, false));
cv.addEventListener('lostpointercapture', e => endPointer(e, false));
cv.addEventListener('contextmenu', e => e.preventDefault());
function faceOf(vx, vy) { return Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? 'left' : 'right') : (vy < 0 ? 'up' : 'down'); }

// ---------- 3. play: render ----------
ctx.imageSmoothingEnabled = false;
const floor = document.createElement('canvas'); floor.width = W; floor.height = H;
(() => {
  const f = floor.getContext('2d');
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let ty = 0; ty < H / TILE; ty++) for (let tx = 0; tx < W / TILE; tx++) {
    f.fillStyle = (tx + ty) % 2 ? '#4a6b45' : '#46663f';
    f.fillRect(tx * TILE, ty * TILE, TILE, TILE);
    for (let k = 0; k < 3; k++) {
      f.fillStyle = rnd() > .5 ? '#55794f' : '#3d5a3a';
      f.fillRect(tx * TILE + (rnd() * 14 | 0), ty * TILE + (rnd() * 14 | 0), 2, 1);
    }
  }
  f.fillStyle = '#8b7d62';
  for (let tx = 0; tx < W / TILE; tx++) f.fillRect(tx * TILE, 0, TILE - 1, 12);
})();

function drawChar(c, x, y, dir, frame, slot, isMe) {
  const dx = Math.round(x - FW / 2), dy = Math.round(y - FH);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fillRect(dx + 5, dy + FH - 2, 10, 2); ctx.fillRect(dx + 4, dy + FH - 1, 12, 1);
  if (imgs[c] && imgs[c].complete) ctx.drawImage(imgs[c], frame * FW, ROWS[dir] * FH, FW, FH, dx, dy, FW, FH);
  // player tag: small coloured flag with P-number above the head
  const tx = dx + 5, ty = dy - 1;
  ctx.fillStyle = '#111'; ctx.fillRect(tx - 1, ty - 1, 11, 7);
  ctx.fillStyle = SLOT_COLORS[slot - 1]; ctx.fillRect(tx, ty, 9, 5);
  drawDigit(slot, tx + 3, ty, isMe);
}
const DIGITS = { 1: ['010', '110', '010', '010', '111'], 2: ['110', '001', '010', '100', '111'], 3: ['110', '001', '010', '001', '110'], 4: ['101', '101', '111', '001', '001'] };
function drawDigit(n, x, y, isMe) {
  ctx.fillStyle = isMe ? '#fff' : '#111';
  (DIGITS[n] || []).forEach((row, r) => [...row].forEach((b, c) => { if (b === '1') ctx.fillRect(x + c, y + r, 1, 1); }));
}

const VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (screen === 'select') {
    const f = Math.floor(now / 125) % 4;
    cardCtx.forEach((c, i) => { c.clearRect(0, 0, FW, FH); if (imgs[i].complete) c.drawImage(imgs[i], f * FW, 0, FW, FH, 0, 0, FW, FH); });
  }
  if (screen === 'play') {
    const run = $('run').checked, speed = run ? 96 : 48;
    // input priority: keys / pad  >  stick  >  tap target
    let vx = 0, vy = 0, step = speed * dt, dir = null;
    if (me.held.size) {
      for (const d of me.held) { vx += VEC[d][0]; vy += VEC[d][1]; }
      dir = [...me.held].pop(); target = null;
    } else if (stick && (stick.vx || stick.vy)) {
      vx = stick.vx; vy = stick.vy; dir = faceOf(vx, vy);
    } else if (target) {
      vx = target.x - me.x; vy = target.y - me.y;
      const dist = Math.hypot(vx, vy);
      if (dist < .5) { target = null; vx = vy = 0; }
      else { dir = faceOf(vx, vy); if (dist < step) step = dist; }
    }
    me.m = vx !== 0 || vy !== 0;
    if (me.m) {
      me.dir = dir;
      const n = Math.hypot(vx, vy);
      me.x = Math.max(FW / 2, Math.min(W - FW / 2, me.x + vx / n * step));
      me.y = Math.max(28, Math.min(H - 2, me.y + vy / n * step));
      me.t += dt * (run ? 12 : 8);
    } else me.t = 0;

    // smooth other players toward their latest reported position
    for (const o of others.values()) {
      const k = 1 - Math.pow(0.001, dt);
      if (Math.hypot(o.x - o.dx, o.y - o.dy) > 60) { o.dx = o.x; o.dy = o.y; }
      o.dx += (o.x - o.dx) * k; o.dy += (o.y - o.dy) * k;
      o.t = o.m ? o.t + dt * 8 : 0;
    }

    ctx.drawImage(floor, 0, 0);
    if (target) {   // destination marker
      const tx = Math.round(target.x), ty = Math.round(target.y), b = (now / 300 | 0) % 2;
      ctx.fillStyle = '#fff6c2';
      ctx.fillRect(tx - 3 - b, ty, 2, 1); ctx.fillRect(tx + 2 + b, ty, 2, 1);
      ctx.fillRect(tx, ty - 2 - b, 1, 2); ctx.fillRect(tx, ty + 1 + b, 1, 2);
    }
    const list = [
      { c: me.c, x: me.x, y: me.y, dir: me.dir, f: me.m ? Math.floor(me.t) % 4 : 0, slot: me.slot, me: true },
      ...[...others.values()].map(o => ({ c: o.c, x: o.dx, y: o.dy, dir: o.dir, f: o.m ? Math.floor(o.t) % 4 : 0, slot: o.slot, me: false })),
    ].sort((a, b) => a.y - b.y);
    for (const p of list) drawChar(p.c, p.x, p.y, p.dir, p.f, p.slot, p.me);
    if (stick) {    // virtual stick
      ctx.save();
      ctx.globalAlpha = .55; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_R, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = .8; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(stick.kx, stick.ky, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if (typeof Peer === 'undefined') {
  $('create').disabled = $('join').disabled = true;
  lobbyMsg('通信用の部品を読み込めませんでした。ページを再読み込みしてください。', true);
}
</script>
