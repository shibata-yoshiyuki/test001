<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ドット歩行テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@400;700&display=swap">
<style>
:root {
  --bg: #e9ecef; --panel: #f7f8fa; --ink: #1f2429; --muted: #5d6670;
  --line: #c9cfd6; --accent: #3b82a6; --key: #ffffff; --warn: #b4532a;
  --display: "DotGothic16", "M PLUS 1p", system-ui, sans-serif;
  --body: "M PLUS 1p", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15191d; --panel: #1d2329; --ink: #e6eaee; --muted: #9aa4ae;
    --line: #333c45; --accent: #6fb6d6; --key: #262e35; --warn: #e08a62; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  font: 14px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0; letter-spacing: .02em; }
h2 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin: 0 0 12px; }
.sub { margin: 0; color: var(--muted); font-size: .9rem; }
.box { border: 3px solid var(--ink); background: var(--panel); padding: 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.card {
  display: grid; justify-items: center; gap: 8px; cursor: pointer;
  background: var(--key); border: 2px solid var(--line); padding: 14px 22px 12px;
  font: 700 .9rem var(--body); color: var(--ink); padding: 10px 6px 8px;
}
.card:hover, .card.last { border-color: var(--accent); }
.card canvas { width: 60px; height: 96px; image-rendering: pixelated; background: #46663f; }
.lobby { display: grid; gap: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font: 700 .95rem var(--body); color: var(--ink); background: var(--key);
  border: 2px solid var(--line); padding: 9px 16px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--key); }
.btn:disabled { opacity: .5; cursor: default; }
input[type=text] {
  font: 1.2rem var(--display); letter-spacing: .25em;
  width: 8.5em; padding: 7px 10px; border: 2px solid var(--line); background: var(--key); color: var(--ink);
}
.msg { min-height: 1.6em; margin: 0; font-size: .9rem; color: var(--muted); }
.msg.err { color: var(--warn); }
.link { font: .9rem var(--body); color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
.label { font-size: .75rem; letter-spacing: .08em; color: var(--muted); }
/* full-screen play view: canvas fills the window, HUD floats on top */
.play { position: fixed; inset: 0; z-index: 10; background: #1d4f6e; overflow: hidden; touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.play * { touch-action: none; }
canvas#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }
.hud-top, .hud-bottom {
  position: absolute; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hud-top { top: 0; padding-top: calc(8px + env(safe-area-inset-top, 0px)); justify-content: space-between; }
.hud-bottom { bottom: 0; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); justify-content: flex-end; align-items: flex-end; }
.chip {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 6px;
  background: rgba(16, 22, 28, .72); color: #f1f4f6; border: 1px solid rgba(255,255,255,.18);
  padding: 5px 10px; font: 700 .85rem var(--body); line-height: 1.4;
}
button.chip { cursor: pointer; }
.chip button { font: inherit; color: #9fd3ee; background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
.chip input { margin: 0; }
.code { font-family: var(--display); font-size: 1.15rem; letter-spacing: .15em; font-weight: 400; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; font-weight: 400; font-size: .8rem; }
.plist li { display: flex; gap: 6px; align-items: center; }
.dot { width: 9px; height: 9px; display: inline-block; flex: none; }
.toast {
  position: absolute; left: 50%; top: calc(56px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  max-width: calc(100% - 32px); margin: 0; text-align: center; pointer-events: none;
  background: rgba(16, 22, 28, .78); color: #f1f4f6; padding: 6px 12px; font-size: .85rem; transition: opacity .6s;
}
.toast:empty { display: none; }
.banner {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); margin: 0; pointer-events: none;
  font: 2.4rem/1.2 var(--display); color: #fff; text-align: center; white-space: nowrap;
  text-shadow: 0 3px 0 #000, 0 0 12px rgba(0,0,0,.6); transition: opacity .5s;
}
.banner:empty { display: none; }
.banner.fade { opacity: 0; }
.banner small { display: block; font-size: .5em; }
#mode-chip { font-weight: 400; color: #ffd98a; }
.atk {
  position: absolute; z-index: 2; width: 84px; height: 84px; border-radius: 50%;
  right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(58px + env(safe-area-inset-bottom, 0px));
  background: rgba(214, 72, 64, .82); color: #fff; border: 3px solid rgba(255,255,255,.75);
  font: 1.05rem var(--display); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
}
.atk.on { background: rgba(255, 120, 100, .95); transform: scale(.94); }
.atk:disabled { background: rgba(90, 90, 90, .7); }
.life { color: #ff6b6b; letter-spacing: .05em; }
.life.down { color: #c0c6cc; }
.toast.fade { opacity: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>ドット歩行テスト</h1>
    <p class="sub">キャラを選んで部屋を作るか、部屋コードで入ると、最大4人で同じ画面を歩けます。</p>
  </div>

  <!-- 1. character select -->
  <section id="select" class="box">
    <h2>使うキャラを選んでください</h2>
    <div class="cards">
      <!-- cards are built from CHARS in the script -->
    </div>
  </section>

  <!-- 2. lobby -->
  <section id="lobby" class="box" hidden>
    <div class="lobby">
      <div>
        <h2>部屋を作る</h2>
        <div class="row">
          <button class="btn primary" id="create-coop">協力モードで作る</button>
          <button class="btn primary" id="create">対戦モードで作る</button>
        </div>
        <p class="sub">協力：みんなで押し寄せる敵のウェーブを倒します（味方には弾が当たりません）。対戦：プレイヤー同士で撃ち合います。<br>作った人が部屋の親になります。親が抜けると部屋は終了します。</p>
      </div>
      <div>
        <h2>部屋に入る</h2>
        <div class="row">
          <label for="code-in" class="label">部屋コード</label>
          <input type="text" id="code-in" maxlength="4" autocomplete="off" inputmode="numeric" pattern="[0-9]*" placeholder="1234">
          <button class="btn" id="join">入る</button>
        </div>
      </div>
      <p class="msg" id="lobby-msg" role="status"></p>
      <button class="link" id="back">キャラを選び直す</button>
      <a class="link" href="items.html">アイテム素材一覧</a>
      <p class="sub" id="ver"></p>
    </div>
  </section>

</div>

<!-- 3. play (full screen) -->
<section id="play" class="play" hidden>
  <canvas id="game" aria-label="ゲーム画面。タップでその場所へ移動、押したままずらすとその方向へ移動"></canvas>
  <div class="hud-top">
    <div class="chip">部屋 <span class="code" id="room-code"></span> <span id="mode-chip"></span> <button id="copy">招待リンクをコピー</button> <span id="copy-msg" role="status"></span></div>
    <div class="chip"><ul class="plist" id="plist" aria-label="参加者"></ul><span id="count" hidden></span></div>
  </div>
  <p class="toast" id="play-msg" role="status"></p>
  <p class="banner" id="banner" aria-live="polite"></p>
  <button class="atk" id="atk" aria-label="攻撃（スペースキー）">攻撃</button>
  <div class="hud-bottom">
    <label class="chip"><input type="checkbox" id="run"> 走る</label>
    <button class="chip" id="fs">全画面</button>
    <button class="chip" id="leave">退出</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
// ---------- constants ----------
// To add a character: put <id>_walk.png (20x32 frames, 4x4) in assets/sprites and add a line here.
const CHARS = [
  ['shibata', '柴田さん'], ['cyber', 'サイバー'], ['yami', 'ヤミさん'], ['kitamura', '北村さん'],
  ['yamada', '山田さん'], ['shindo', '新藤さん'], ['takeda', '武田さん'], ['kikuchi', '菊地さん'], ['mabuchi', '馬淵さん'],
];
const SHEETS = CHARS.map(c => 'assets/sprites/' + c[0] + '_walk.png');
const NAMES = CHARS.map(c => c[1]);
(() => {
  const box = document.querySelector('#select .cards');
  CHARS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'card'; b.id = 'pick-' + i; b.dataset.i = String(i);
    const cv = document.createElement('canvas'); cv.width = 20; cv.height = 32;
    const sp = document.createElement('span'); sp.textContent = c[1];
    b.append(cv, sp); box.append(b);
  });
})();
const SLOT_COLORS = ['#e8c547', '#e0644f', '#5aa9e6', '#9b6be0'];   // P1..P4 tags
const FW = 20, FH = 32, ROWS = { down: 0, left: 1, right: 2, up: 3 };
const TILE = 16, MAX = 4;
const MAP_W = 72, MAP_H = 54;                 // island map in tiles (the edge is sea)
const WORLD_W = MAP_W * TILE, WORLD_H = MAP_H * TILE;
const ID_PREFIX = 'dotwalk-shibata-test001-';
const CODE_CHARS = '0123456789';
const VERSION = '2026-11-12b';         // bump on every release; host and guests must match
const SEND_MS = 66, TIMEOUT_MS = 6000;
// battle
const LIFE_MAX = 3, SHOT_SPEED = 170, SHOT_RANGE = 150, SHOT_CD = 450, INV_MS = 1000, DOWN_MS = 3000;

const $ = id => document.getElementById(id);
// no zooming: pinch, Safari gestures, Ctrl+wheel and Ctrl +/- / 0 (double-tap zoom is off via touch-action in CSS)
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0', ';'].includes(e.key)) e.preventDefault();
});
$('ver').textContent = 'ページの版：' + VERSION;
// stale-page check: browsers may keep an old copy of this page for a few minutes
if (typeof fetch === 'function') fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => {
  const m = t.match(/const VERSION = '([^']+)'/);
  if (m && m[1] !== VERSION) {
    $('ver').innerHTML = '';
    const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = '新しい版があります。ここを押して再読み込み';
    b.addEventListener('click', () => location.replace(location.pathname + '?v=' + Date.now() + (new URLSearchParams(location.search).get('room') ? '&room=' + new URLSearchParams(location.search).get('room') : '')));
    $('ver').append(b);
    if ($('lobby').hidden && $('select').hidden) toast('新しい版のページがあります。退出してから再読み込みしてください。');
  }
}).catch(() => {});
const imgs = SHEETS.map(src => { const im = new Image(); im.src = src; return im; });

// ---------- state ----------
const me = { c: 0, x: WORLD_W / 2, y: WORLD_H / 2, dir: 'down', m: false, t: 0, held: new Set(), slot: 0,
  life: LIFE_MAX, down: false, inv: false, ko: 0, aimX: 0, aimY: 1, lastShot: -1e9, atkT: -1e9 };
const shots = new Map();           // id -> {id, slot, x, y, vx, vy, dist}   (x,y = point on the ground)
let sparks = [];                   // hit effects
let shotSeq = 0, atkHeld = false;
const stats = new Map();           // host only: slot -> {life, invUntil, down, downUntil, ko}
let mode = 'pvp';                  // 'pvp' | 'coop'
// enemies (assets: 0x72 DungeonTileset II, CC0) — sprites face right; feet at (x, y)
const ENEMY_TYPES = [
  { key: 'swampy',      name: 'スライム',   hp: 1,  spd: 24, fw: 16, fh: 16, sc: 1, hw: 7,  hh: 13 },
  { key: 'goblin',      name: 'ゴブリン',   hp: 1,  spd: 44, fw: 16, fh: 16, sc: 1, hw: 5,  hh: 10 },
  { key: 'skelet',      name: 'ガイコツ',   hp: 3,  spd: 26, fw: 16, fh: 16, sc: 1, hw: 5,  hh: 14 },
  { key: 'necromancer', name: 'まじない師', hp: 2,  spd: 22, fw: 16, fh: 23, sc: 1, hw: 6,  hh: 15, shooter: true },
  { key: 'big_demon',   name: 'ボス',       hp: 30, spd: 20, fw: 32, fh: 36, sc: 2, hw: 22, hh: 56, boss: true },
];
const ENEMY_IMGS = ENEMY_TYPES.map(t => { const im = new Image(); im.src = 'assets/enemies/' + t.key + '.png'; return im; });
const MAX_ALIVE = 24, ENEMY_BULLET = '#b45cff';
let enemies = new Map();           // id -> {id, type, x, y, hp, maxHp, face, ...}  (host: authoritative, guest: interpolated copy)
let enemySeq = 0;
const game = { wave: 0, phase: 'wait', until: 0, queue: [], nextSpawn: 0, banner: '' };
let lastUI = '';
const freshStat = () => ({ life: LIFE_MAX, invUntil: performance.now() + 1500, down: false, downUntil: 0, ko: 0 });
let screen = 'select';
let peer = null, isHost = false, roomCode = '';
let hostConn = null;               // client side: connection to host
const conns = new Map();           // host side: peerId -> {conn, slot, last}
let others = new Map();            // key -> {slot,c,x,y,dir,m, dx,dy,t}
let lastHostMsg = 0;

function show(name) {
  screen = name;
  $('select').hidden = name !== 'select';
  $('lobby').hidden = name !== 'lobby';
  $('play').hidden = name !== 'play';
}
function lobbyMsg(text, err) { const el = $('lobby-msg'); el.textContent = text; el.classList.toggle('err', !!err); }

// ---------- 1. select ----------
const cardCtx = CHARS.map((_, i) => { const c = document.querySelector('#pick-' + i + ' canvas').getContext('2d'); c.imageSmoothingEnabled = false; return c; });
try { const s = localStorage.getItem('chara'); if (s !== null) $('pick-' + s)?.classList.add('last'); } catch (e) {}
document.querySelectorAll('.card').forEach(b => b.addEventListener('click', () => {
  me.c = Math.min(CHARS.length - 1, Math.max(0, +b.dataset.i | 0));
  try { localStorage.setItem('chara', String(me.c)); } catch (e) {}
  show('lobby'); lobbyMsg('');
  const q = new URLSearchParams(location.search).get('room');
  if (q) { $('code-in').value = q.replace(/\D/g, '').slice(0, 4); $('join').focus(); }
}));
$('back').addEventListener('click', () => show('select'));

// ---------- 2. lobby / networking ----------
function randomCode() { let s = ''; for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.random() * CODE_CHARS.length | 0]; return s; }
function busy(b) { $('create').disabled = b; $('create-coop').disabled = b; $('join').disabled = b; }

function errorText(type) {
  return ({
    'peer-unavailable': 'その部屋コードの部屋が見つかりません。コードを確認するか、部屋が開いているか親に確認してください。',
    'network': '通信サーバーにつながりません。ネットワークを確認してもう一度試してください。',
    'server-error': '通信サーバーでエラーが起きました。少し待ってからもう一度試してください。',
    'browser-incompatible': 'このブラウザは対応していません。Chrome・Safari・Edgeの最新版で開いてください。',
  })[type] || '接続できませんでした（' + type + '）。もう一度試してください。';
}

$('create').addEventListener('click', () => createRoom(0, 'pvp'));
$('create-coop').addEventListener('click', () => createRoom(0, 'coop'));
function createRoom(tries, m) {
  busy(true); lobbyMsg('部屋を作っています…');
  const code = randomCode();
  const p = new Peer(ID_PREFIX + code);
  p.on('open', () => {
    peer = p; isHost = true; roomCode = code; me.slot = 1; me.x = spawnX(1); me.y = WORLD_H / 2;
    stats.clear(); stats.set(1, freshStat());
    mode = m; resetGame();
    p.on('connection', onHostConnection);
    enterPlay();
  });
  p.on('error', err => {
    if (err.type === 'unavailable-id' && tries < 8) { p.destroy(); createRoom(tries + 1, m); return; }
    if (peer === p) { console.warn('peer error (room kept)', err.type); return; }   // already hosting: keep the room, 'disconnected' reconnects
    p.destroy(); busy(false); lobbyMsg(errorText(err.type), true);
  });
  p.on('disconnected', () => { if (peer === p) p.reconnect(); });
}

$('join').addEventListener('click', joinRoom);
$('code-in').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
function joinRoom() {
  const code = $('code-in').value.replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/\D/g, '');
  if (!/^\d{4}$/.test(code)) { lobbyMsg('部屋コードは4桁の数字です。', true); return; }
  busy(true); lobbyMsg('部屋に入っています…');
  const p = new Peer();
  let giveUp = 0;
  p.on('open', () => {
    const conn = p.connect(ID_PREFIX + code, { reliable: true, metadata: { c: me.c, v: VERSION } });
    giveUp = setTimeout(() => { if (!hostConn) { p.destroy(); busy(false); lobbyMsg('部屋に入れませんでした。コードを確認してもう一度試してください。', true); } }, 10000);
    conn.on('data', d => {
      if (d.t === 'full') { clearTimeout(giveUp); p.destroy(); busy(false); lobbyMsg('この部屋は満員です（最大4人）。', true); return; }
      if (d.t === 'version') {
        clearTimeout(giveUp); p.destroy(); busy(false);
        lobbyMsg('部屋の親とページの版が違います（親：' + d.v + '／あなた：' + VERSION + '）。親もあなたも、ページを再読み込みしてから入り直してください。', true); return;
      }
      if (d.t === 'welcome') {
        clearTimeout(giveUp);
        peer = p; isHost = false; roomCode = code; hostConn = conn; me.slot = d.slot; mode = d.mode === 'coop' ? 'coop' : 'pvp';
        me.x = d.x; me.y = d.y; lastHostMsg = performance.now();
        enterPlay();
        return;
      }
      if (d.t === 'all') { lastHostMsg = performance.now(); applyAll(d.ps); if (d.en) applyEnemies(d.en); if (d.g) updateGameUI(d.g); }
      else if (d.t === 'shot') addShot(d, true);
      else if (d.t === 'ehit') onEhit(d);
      else if (d.t === 'hit') onHit(d);
      else if (d.t === 'respawn') onRespawn(d);
    });
    conn.on('close', () => { if (hostConn === conn) endRoom('親が部屋を閉じたため、部屋が終了しました。'); });
  });
  p.on('error', err => {
    if (peer === p) { console.warn('peer error (still in room)', err.type); return; }  // in room: the host timeout decides
    clearTimeout(giveUp); p.destroy(); busy(false); lobbyMsg(errorText(err.type), true);
  });
}

// host side
function spawnX(slot) { return WORLD_W / 2 + (slot - 2.5) * 28; }
function freeSlot() { const used = new Set([1, ...[...conns.values()].map(v => v.slot)]); for (let s = 1; s <= MAX; s++) if (!used.has(s)) return s; return 0; }
function onHostConnection(conn) {
  conn.on('open', () => {
    if (!conn.metadata || conn.metadata.v !== VERSION) {
      conn.send({ t: 'version', v: VERSION }); setTimeout(() => conn.close(), 500);
      toast('違う版のページから入ろうとした人がいます。全員ページを再読み込みしてください。'); return;
    }
    const slot = freeSlot();
    if (!slot) { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 500); return; }
    const st = { slot, c: Math.min(CHARS.length - 1, Math.max(0, (conn.metadata && conn.metadata.c) | 0)), x: spawnX(slot), y: WORLD_H / 2, dir: 'down', m: false };
    conns.set(conn.peer, { conn, slot, last: performance.now() });
    stats.set(slot, freshStat());
    others.set(conn.peer, { ...st, dx: st.x, dy: st.y, t: 0 });
    conn.send({ t: 'welcome', slot, x: st.x, y: st.y, mode });
    renderList();
  });
  conn.on('data', d => {
    const rec = conns.get(conn.peer); if (!rec) return;
    if (d.t === 'shot') {                       // relay a client's shot to everyone else
      const st = stats.get(rec.slot);
      if (!st || st.down || d.slot !== rec.slot) return;

// ---------- 3. play: input ----------
const KEYMAP = { KeyW: 'up', KeyA: 'left', KeyS: 'down', KeyD: 'right', ArrowUp: 'up', ArrowLeft: 'left', ArrowDown: 'down', ArrowRight: 'right' };
const ATTACK_KEYS = new Set(['Space', 'KeyJ', 'Enter']);
addEventListener('keydown', e => {

addEventListener('keyup', e => { if (ATTACK_KEYS.has(e.code)) atkHeld = false; const d = KEYMAP[e.code]; if (d) me.held.delete(d); });
addEventListener('blur', () => { me.held.clear(); atkHeld = false; });
{
  const b = $('atk');

}
document.querySelectorAll('.pad button').forEach(b => {

// tap = walk to that spot / press and slide = virtual stick (mouse and touch)
const cv = $('game'), ctx = cv.getContext('2d');
const TAP_MS = 350, DRAG_PX = 12, DEAD_PX = 6, STICK_R = 14;
let ptr = null;        // active pointer on the stage
let target = null;     // {x, y} in world pixels
let stick = null;      // {ox, oy, vx, vy, kx, ky} in screen (view) pixels
let VW = 320, VH = 192, camX = 0, camY = 0;
function toGame(e) {   // view pixels
  const r = cv.getBoundingClientRect(), k = VW / r.width;

function resize() {

  VW = Math.ceil(r.width * dpr / scale); VH = Math.ceil(r.height * dpr / scale);

}
addEventListener('resize', () => { if (screen === 'play') resize(); });
cv.addEventListener('pointerdown', e => {
  if (screen === 'play' && e.pointerType === 'mouse' && e.button === 2) {   // PC: right click = shoot toward the cursor
    e.preventDefault();
    const g = toGame(e);
    fire(g.x + camX - me.x, g.y + camY - (me.y - 12));

  }

// ---------- 3. play: render ----------
ctx.imageSmoothingEnabled = false;
// island: seeded so every player sees the same map
const land = [], beach = [];
const world = document.createElement('canvas'); world.width = WORLD_W; world.height = WORLD_H;
(() => {
  let seed = 20261106; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // value noise for a ragged coastline
  const G = 6, gw = Math.ceil(MAP_W / G) + 2, gh = Math.ceil(MAP_H / G) + 2, grid = [];
  for (let i = 0; i < gw * gh; i++) grid.push(rnd());
  const sm = t => t * t * (3 - 2 * t);
  const noise = (x, y) => {
    const gx = x / G, gy = y / G, ix = Math.floor(gx), iy = Math.floor(gy), fx = sm(gx - ix), fy = sm(gy - iy);
    const v = (a, b) => grid[(iy + b) * gw + (ix + a)];

    land.push([]); beach.push([]);

      const d = Math.min(x, y, MAP_W - 1 - x, MAP_H - 1 - y);
      land[y].push(d >= 4 + noise(x, y) * 5);

  }
  const isLand = (x, y) => x >= 0 && y >= 0 && x < MAP_W && y < MAP_H && land[y][x];
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    let nearSea = false;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (!isLand(x + dx, y + dy)) nearSea = true;
    beach[y].push(land[y][x] && nearSea);
  }
  const f = world.getContext('2d');
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const px = x * TILE, py = y * TILE;
    if (!land[y][x]) {
      let shallow = false;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (isLand(x + dx, y + dy)) shallow = true;
      f.fillStyle = shallow ? '#3f8fb0' : '#2a6f93'; f.fillRect(px, py, TILE, TILE);
      if (shallow) {   // foam along the shore
        f.fillStyle = '#d7eef5';
        if (isLand(x, y - 1)) f.fillRect(px, py, TILE, 1);
        if (isLand(x, y + 1)) f.fillRect(px, py + TILE - 1, TILE, 1);
        if (isLand(x - 1, y)) f.fillRect(px, py, 1, TILE);
        if (isLand(x + 1, y)) f.fillRect(px + TILE - 1, py, 1, TILE);

    }
    if (beach[y][x]) {
      f.fillStyle = '#e3d29c'; f.fillRect(px, py, TILE, TILE);
      for (let k = 0; k < 4; k++) { f.fillStyle = rnd() > .5 ? '#d3bf83' : '#efe2b6'; f.fillRect(px + (rnd() * 15 | 0), py + (rnd() * 15 | 0), 1, 1); }
      continue;
    }
    f.fillStyle = (x + y) % 2 ? '#4a6b45' : '#46663f'; f.fillRect(px, py, TILE, TILE);
    for (let k = 0; k < 3; k++) { f.fillStyle = rnd() > .5 ? '#55794f' : '#3d5a3a'; f.fillRect(px + (rnd() * 14 | 0), py + (rnd() * 14 | 0), 2, 1); }
    const r = rnd();
    if (r < .06) {            // small flowers
      const c = ['#f2e15c', '#f5f5f5', '#e98aa6'][rnd() * 3 | 0];
      const fx = px + 3 + (rnd() * 9 | 0), fy = py + 3 + (rnd() * 9 | 0);
      f.fillStyle = c; f.fillRect(fx, fy, 1, 1); f.fillRect(fx + 3, fy + 2, 1, 1);
    } else if (r < .09) {     // grass tuft
      const fx = px + 4 + (rnd() * 7 | 0), fy = py + 5 + (rnd() * 7 | 0);
      f.fillStyle = '#6a9a5c'; f.fillRect(fx, fy, 1, 3); f.fillRect(fx + 2, fy + 1, 1, 2); f.fillRect(fx - 2, fy + 1, 1, 2);
    }
  }
})();
function walkable(px, py) {
  const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  return tx >= 0 && ty >= 0 && tx < MAP_W && ty < MAP_H && land[ty][tx];
}
function canStand(x, y) {   // small box around the feet
  return walkable(x - 5, y) && walkable(x + 5, y) && walkable(x - 5, y - 4) && walkable(x + 5, y - 4);
}
function drawWaves(now) {   // little moving highlights on visible sea tiles
  const x0 = Math.floor(camX / TILE) - 1, y0 = Math.floor(camY / TILE) - 1;
  const x1 = Math.ceil((camX + VW) / TILE) + 1, y1 = Math.ceil((camY + VH) / TILE) + 1;
  ctx.fillStyle = 'rgba(220, 242, 250, .55)';
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const inMap = x >= 0 && y >= 0 && x < MAP_W && y < MAP_H;
    if (inMap && land[y][x]) continue;
    const h = ((x * 73856093) ^ (y * 19349663)) >>> 0;
    if (h % 5) continue;
    const ph = (now / 900 + (h % 97) / 97) % 1;
    const wx = x * TILE + 2 + (h % 7) + Math.round(Math.sin(ph * Math.PI * 2) * 2), wy = y * TILE + 4 + (h >> 3) % 8;
    ctx.fillRect(wx, wy, 4, 1); ctx.fillRect(wx + 1, wy - 1, 2, 1);

const HEART = ['01010', '11111', '11111', '01110', '00100'];
function drawEnemy(e, x, y, now) {
  const T = ENEMY_TYPES[e.type], im = ENEMY_IMGS[e.type], sc = T.sc;
  const w = T.fw * sc, h = T.fh * sc, dx = Math.round(x - w / 2), dy = Math.round(y - h);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(Math.round(x - T.hw), Math.round(y) - 1, T.hw * 2, 2);
  if (now - (e.flash || 0) < 160 && (now / 50 | 0) % 2) return;        // hit flash

    if (e.face < 0) { ctx.save(); ctx.translate(dx + w, dy); ctx.scale(-1, 1); ctx.drawImage(im, f * T.fw, 0, T.fw, T.fh, 0, 0, w, h); ctx.restore(); }
    else ctx.drawImage(im, f * T.fw, 0, T.fw, T.fh, dx, dy, w, h);

    const bw = T.boss ? 40 : 12, bx = Math.round(x - bw / 2), by = dy - 4;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 4);
    ctx.fillStyle = T.boss ? '#ff4d6d' : '#f2c14e'; ctx.fillRect(bx, by, Math.max(0, Math.round(bw * e.hp / e.maxHp)), 2);

  if (now - (p.atkT || -1e9) < 140) { frame = 1; dx += Math.round((p.ax || 0) * 2); dy += Math.round((p.ay || 0) * 2); }   // small lunge
  const blink = p.inv && !p.down && (now / 90 | 0) % 2;

  if (!blink && imgs[c] && imgs[c].complete) ctx.drawImage(imgs[c], (p.down ? 0 : frame) * FW, ROWS[p.down ? 'down' : dir] * FH, FW, FH, dx, dy, FW, FH);

    HEART.forEach((row, r) => [...row].forEach((b, cc) => { if (b === '1') ctx.fillRect(hx + cc, hy + r, 1, 1); }));
  }

  const tx = dx + 5, ty = dy - 1;
  ctx.fillStyle = '#111'; ctx.fillRect(tx - 1, ty - 1, 11, 7);
  ctx.fillStyle = SLOT_COLORS[slot - 1]; ctx.fillRect(tx, ty, 9, 5);

}
const DIGITS = { 1: ['010', '110', '010', '010', '111'], 2: ['110', '001', '010', '100', '111'], 3: ['110', '001', '010', '001', '110'], 4: ['101', '101', '111', '001', '001'] };
function drawDigit(n, x, y, isMe) {
  ctx.fillStyle = isMe ? '#fff' : '#111';
  (DIGITS[n] || []).forEach((row, r) => [...row].forEach((b, c) => { if (b === '1') ctx.fillRect(x + c, y + r, 1, 1); }));

const VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (screen === 'select') {
    const f = Math.floor(now / 125) % 4;
    cardCtx.forEach((c, i) => { c.clearRect(0, 0, FW, FH); if (imgs[i].complete) c.drawImage(imgs[i], f * FW, 0, FW, FH, 0, 0, FW, FH); });
  }
  if (screen === 'play') {
    const run = $('run').checked, speed = run ? 96 : 48;
    // input priority: keys / pad  >  stick  >  tap target
    let vx = 0, vy = 0, step = speed * dt, dir = null;
    if (me.down) { /* can't move while down */ }
    else if (me.held.size) {

      dir = [...me.held].pop(); target = null;
    } else if (stick && (stick.vx || stick.vy)) {
      vx = stick.vx; vy = stick.vy; dir = faceOf(vx, vy);
    } else if (target) {
      vx = target.x - me.x; vy = target.y - me.y;
      const dist = Math.hypot(vx, vy);

      let moved = false;
      if (canStand(me.x + mx, me.y)) { me.x += mx; moved = moved || Math.abs(mx) > 1e-3; }   // per-axis so you slide along the shore
      if (canStand(me.x, me.y + my)) { me.y += my; moved = moved || Math.abs(my) > 1e-3; }
      if (!moved) { me.m = false; if (target) target = null; }
      me.t += dt * (run ? 12 : 8);
    }
    if (!me.m) me.t = 0;
    if (!canStand(me.x, me.y)) { me.x = WORLD_W / 2; me.y = WORLD_H / 2; }   // safety net: never stuck in the sea
    camX = Math.round(me.x - VW / 2); camY = Math.round(me.y - 16 - VH / 2);
    if (atkHeld) fire();

    if (isHost && mode === 'coop') stepEnemies(dt, now);
    else for (const e of enemies.values()) {
      const k = 1 - Math.pow(0.001, dt);
      if (Math.hypot(e.x - e.dx, e.y - e.dy) > 60) { e.dx = e.x; e.dy = e.y; }
      e.dx += (e.x - e.dx) * k; e.dy += (e.y - e.dy) * k;
    }

      const k = 1 - Math.pow(0.001, dt);
      if (Math.hypot(o.x - o.dx, o.y - o.dy) > 60) { o.dx = o.x; o.dy = o.y; }
      o.dx += (o.x - o.dx) * k; o.dy += (o.y - o.dy) * k;
      o.t = o.m ? o.t + dt * 8 : 0;
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#2a6f93'; ctx.fillRect(0, 0, VW, VH);          // open sea beyond the map
    ctx.setTransform(1, 0, 0, 1, -camX, -camY);                       // world space
    ctx.drawImage(world, 0, 0);
    drawWaves(now);
    if (target) {   // destination marker
      const tx = Math.round(target.x), ty = Math.round(target.y), b = (now / 300 | 0) % 2;
      ctx.fillStyle = '#fff6c2';

    const drawables = list.map(p => ({ y: p.y, draw: () => drawChar(p.c, p.x, p.y, p.dir, p.f, p.slot, p.me, p.p) }));
    for (const e of enemies.values()) {
